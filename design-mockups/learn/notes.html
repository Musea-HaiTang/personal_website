<!doctype html>
<!--
  学习笔记页原型（PROTOTYPE，可丢弃）
  问题：笔记的导入与全文检索页面，哪种结构最顺手？
  - A「双栏书架」：左侧文件夹树 + 笔记列表合并为一栏，右侧阅读面板；侧栏可收起（几乎全屏看笔记）；编辑/删除为右上角图标
  - B「卡片 + 弹窗阅读」：顶部搜索 + 文件夹胶囊筛选 + 卡片列表，点开笔记居中弹窗（信纸样式，右上角编辑/删除/关闭图标，可关闭看弹窗外页面）
  两变体共用：导入弹窗（粘贴新建 / 上传 .md / 批量导入文件夹）、全文检索高亮。
  只读演示：文件夹/胶囊筛选、搜索即时过滤并高亮、导入弹窗、笔记打开（弹窗阅读）、侧栏收起/展开。无持久化。
  沿用手站「纸感」主题（frontend/tailwind.config.js 色板与衬线字体）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔记页原型 · 学习笔记 · design-mockups/learn</title>
<style>
  :root {
    --paper: #f7f5f1; --paper-soft: #f4f1ea; --card: #fffefc; --hairline: #e9e3d9;
    --ink: #2b2622; --sub: #7c7468; --teal: #0e7c74; --teal-dark: #0a6a63; --teal-soft: #e7f1ef;
    --amber: #b7791f; --amber-soft: #faf1dd; --red: #c4533a; --red-soft: #f9ebe5;
    --serif: "Songti SC", "STSong", SimSun, serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b2622; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--teal); }
  button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
  mark.hl { background: var(--amber-soft); color: var(--amber); border-radius: 2px; padding: 0 1px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 700; margin: 0; }

  .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 90px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .bar h1 { font-size: 22px; letter-spacing: 2px; }
  .bar-main { display: flex; align-items: center; gap: 12px; flex: 1; }
  .search { width: 360px; border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 9px 14px; font-size: 14px; color: var(--ink); }
  .search::placeholder { color: var(--sub); }
  .search:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: var(--teal); border: 1px solid var(--teal); padding: 8px 16px; color: #fff; font-size: 14px; font-weight: 500; }
  .btn-primary:hover { background: var(--teal-dark); }
  .count { font-size: 12px; font-weight: 500; color: var(--sub); background: var(--paper-soft); border-radius: 999px; padding: 1px 9px; }

  /* ---------- A：三栏书架 ---------- */
  .a-pane { display: grid; grid-template-columns: 260px 1fr; gap: 14px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px; padding: 14px; }
  .a-side h2 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .side-head { display: flex; align-items: center; justify-content: space-between; }
  .side-head h2 { margin-bottom: 0; }
  .collapse-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--hairline); display: grid; place-items: center; color: var(--sub); font-size: 14px; }
  .collapse-btn:hover { color: var(--teal); border-color: var(--teal); }
  .side-divider { border-top: 1px dashed var(--hairline); margin: 10px 0; }
  .a-pane.collapsed { grid-template-columns: 0 1fr; }
  .a-pane.collapsed .a-side { display: none; }
  .expand-btn { position: fixed; left: 14px; top: 112px; z-index: 40; border: 1px solid var(--hairline); background: var(--card); border-radius: 999px; padding: 8px 13px; font-size: 13px; color: var(--teal-dark); box-shadow: 0 4px 14px rgba(43, 38, 34, .12); }
  .folder { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; font-size: 14px; }
  .folder:hover { background: var(--paper-soft); }
  .folder.active { background: var(--teal-soft); color: var(--teal-dark); font-weight: 600; }
  .folder .f-icon { margin-right: 7px; }
  .note-item { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; border-bottom: 1px dashed var(--hairline); }
  .note-item:hover { background: var(--paper-soft); }
  .note-item.active { background: var(--teal-soft); }
  .note-item .t { font-size: 14px; font-weight: 600; }
  .note-item .x { font-size: 12px; color: var(--sub); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .tag { font-size: 11px; color: var(--teal-dark); background: var(--teal-soft); border-radius: 999px; padding: 1px 8px; }
  .tag-editor { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .tag-editor .tag:hover { background: var(--teal); color: #fff; }
  .tag-rem { margin-left: 3px; opacity: .45; }
  .tag-add { font-size: 12px; color: var(--teal-dark); border: 1px dashed var(--teal); border-radius: 999px; padding: 2px 10px; background: var(--teal-soft); }
  .tag-add:hover { background: var(--teal); color: #fff; }
  .tag-input { width: 110px; font-size: 12px; border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 10px; background: var(--card); }
  .tag-input:focus { border-color: var(--teal); outline: none; }
  .reader { min-height: 420px; }
  .reader-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .reader-top h2 { flex: 1; font-size: 20px; }
  .editable { outline: none; }
  .editable:hover { outline: 1px dashed var(--teal); outline-offset: 3px; border-radius: 4px; }
  .editable:focus { outline: 2px solid var(--teal-soft); }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--sub); }
  .icon-btn:hover { color: var(--teal); background: var(--paper-soft); }
  .icon-btn.danger:hover { color: var(--red); }
  .icon-btn svg { width: 16px; height: 16px; }
  .reader .meta { font-size: 12px; color: var(--sub); margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
  .reader .body { font-size: 14px; color: var(--ink); }
  .reader .body h3 { font-size: 15px; margin: 14px 0 6px; }
  .reader .body p { margin: 8px 0; }
  .reader .body pre { background: var(--paper-soft); border: 1px solid var(--hairline); border-radius: 8px; padding: 10px; font-size: 12.5px; overflow-x: auto; }
  .reader-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn { border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 7px 14px; font-size: 13px; }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn-danger:hover { border-color: var(--red); color: var(--red); }

  /* ---------- B：两栏阅读流 ---------- */
  .b-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--hairline); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
  .chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
  .b-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .b-card { background: var(--card); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .b-card:hover { border-color: var(--teal); }
  .b-card.active { border-color: var(--teal); background: var(--teal-soft); }
  .b-card .t { font-size: 15px; font-weight: 600; }
  .b-card .x { font-size: 12.5px; color: var(--sub); flex: 1; }
  .b-card .m { font-size: 11px; color: var(--sub); }

  /* ---------- 信纸弹窗 ---------- */
  .modal-mask { position: fixed; inset: 0; z-index: 50; background: rgba(43, 38, 34, .35); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #reader-mask .letter { background: #f4f9f6; border-color: #cfe5dc; }
  .letter { width: 100%; max-width: 680px; max-height: 84vh; overflow: auto; background: var(--card); border: 1px solid var(--hairline); border-radius: 8px; padding: 34px 40px; box-shadow: 0 16px 40px rgba(43, 38, 34, .18); }
  .letter::-webkit-scrollbar { width: 6px; }
  .letter::-webkit-scrollbar-track { background: transparent; }
  .letter::-webkit-scrollbar-thumb { background: #2b2622; border-radius: 999px; }
  .letter::-webkit-scrollbar-thumb:hover { background: var(--teal); }
  .letter-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .letter-top h2 { flex: 1; }
  .letter h2 { font-size: 22px; }
  .letter .meta { font-size: 12px; color: var(--sub); margin: 6px 0 16px; }
  .reader-top .reader-actions, .letter-top .reader-actions { margin-top: 0; }

  /* ---------- 导入弹窗 ---------- */
  .modal { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; padding: 22px; box-shadow: 0 16px 40px rgba(43, 38, 34, .18); }
  .modal-head h3 { font-size: 18px; margin-bottom: 14px; }
  .modal-tabs { display: flex; gap: 4px; background: var(--paper-soft); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .modal-tab { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 14px; color: var(--sub); text-align: center; }
  .modal-tab.active { background: var(--card); color: var(--teal-dark); font-weight: 600; box-shadow: 0 1px 3px rgba(43, 38, 34, .08); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 9px 12px; font-size: 14px; color: var(--ink); font-family: inherit; }
  .field textarea { min-height: 120px; resize: vertical; }
  .drop { border: 1.5px dashed var(--hairline); border-radius: 12px; padding: 26px; text-align: center; color: var(--sub); font-size: 13px; }
  .drop:hover { border-color: var(--teal); color: var(--teal); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .tree-demo { border: 1px solid var(--hairline); border-radius: 10px; padding: 10px; font-size: 13px; color: var(--sub); }
  .tree-demo .row { padding: 4px 6px; }
  .tree-demo .row.sel { background: var(--teal-soft); color: var(--teal-dark); border-radius: 6px; }

  .variant { display: none; }
  .variant.show { display: block; }

  /* ---------- 变体切换条 ---------- */
  .switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; box-shadow: 0 8px 24px rgba(43, 38, 34, .3); font-size: 14px; }
  .switcher button { color: #fff; font-size: 18px; line-height: 1; padding: 0 4px; }
  .switcher .label { min-width: 210px; text-align: center; }

  @media (max-width: 1000px) { .a-pane { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- 示例数据（模拟后端 /api/notes 返回结构） ---------- */
const FOLDERS = [
  { id: 'py', name: 'Python 笔记', count: 6 },
  { id: 'vue', name: 'Vue3 笔记', count: 5 },
  { id: 'misc', name: '未分类', count: 1 }
];
const NOTES = [
  { id: 1, folder: 'py', title: '装饰器原理与应用', updated: '2026-08-14', tags: ['装饰器', '进阶'], excerpt: '装饰器本质是一个可调用对象，接收函数并返回新函数……', body: '<h3>本质</h3><p>装饰器是一个接收函数并返回新函数的可调用对象，等价于 <code>f = deco(f)</code>。</p><h3>常见场景</h3><p>日志、计时、权限校验。</p><pre>import functools\ndef timer(fn):\n    @functools.wraps(fn)\n    def wrap(*a, **kw):\n        print(fn.__name__)\n        return fn(*a, **kw)\n    return wrap</pre>' },
  { id: 2, folder: 'py', title: '生成器与迭代器', updated: '2026-08-10', tags: ['基础'], excerpt: 'yield 关键字把函数变成生成器，惰性求值节省内存……', body: '<h3>迭代协议</h3><p>实现 <code>__iter__</code> 与 <code>__next__</code> 的对象可被 for 遍历。</p><h3>生成器</h3><p>函数内出现 <code>yield</code> 即为生成器函数，调用返回生成器对象，逐个产出值。</p>' },
  { id: 3, folder: 'py', title: 'asyncio 协程入门', updated: '2026-08-05', tags: ['异步'], excerpt: 'async/await 让 IO 密集任务并发执行，事件循环调度……', body: '<h3>事件循环</h3><p><code>asyncio.run()</code> 创建事件循环并运行协程。</p><h3>并发示例</h3><p><code>asyncio.gather(a(), b())</code> 并发执行多个协程。</p>' },
  { id: 4, folder: 'py', title: '上下文管理器 with', updated: '2026-07-28', tags: ['基础'], excerpt: 'with 语句统一资源的获取与释放，__enter__/__exit__……', body: '<h3>用途</h3><p>文件、锁、数据库连接等资源的自动释放。</p><pre>with open("a.txt") as f:\n    data = f.read()</pre>' },
  { id: 5, folder: 'py', title: '列表推导与生成器表达式', updated: '2026-07-20', tags: ['基础'], excerpt: '一行写出过滤与映射，注意可读性与内存差异……', body: '<h3>列表推导</h3><p><code>[x*2 for x in range(10) if x % 2 == 0]</code></p><h3>生成器表达式</h3><p>把方括号换成圆括号，惰性求值，适合大数据量。</p>' },
  { id: 6, folder: 'py', title: '类型注解与 Pydantic', updated: '2026-07-15', tags: ['类型'], excerpt: '类型注解配合 Pydantic v2 做运行时校验……', body: '<h3>为什么需要</h3><p>注解只提供静态提示，Pydantic 在运行时校验并转换。</p><pre>class User(BaseModel):\n    name: str\n    age: int</pre>' },
  { id: 7, folder: 'vue', title: '响应式原理 ref/reactive', updated: '2026-08-12', tags: ['响应式', '原理'], excerpt: 'Proxy 拦截对象读写，依赖收集与触发更新……', body: '<h3>核心</h3><p><code>reactive</code> 用 Proxy 代理对象，读取时收集依赖，写入时触发更新。</p><h3>ref</h3><p>包装基本类型，<code>.value</code> 访问，模板中自动解包。</p>' },
  { id: 8, folder: 'vue', title: '组合式 API 与 setup', updated: '2026-08-08', tags: ['基础'], excerpt: 'setup 内组织逻辑，computed/watch 响应式派生……', body: '<h3>setup</h3><p>组件逻辑集中在一个函数中，按功能拆分，替代 Options API 的散落写法。</p><h3>常用</h3><p><code>ref</code>、<code>computed</code>、<code>watch</code>、<code>onMounted</code>。</p>' },
  { id: 9, folder: 'vue', title: 'Pinia 状态管理', updated: '2026-08-01', tags: ['状态'], excerpt: 'defineStore 定义 store，state/getters/actions 分离……', body: '<h3>定义</h3><pre>export const useStore = defineStore("main", {\n  state: () => ({ n: 0 }),\n  actions: { add() { this.n++ } }\n})</pre>' },
  { id: 10, folder: 'vue', title: '路由守卫与懒加载', updated: '2026-07-25', tags: ['路由'], excerpt: 'beforeEach 做登录校验，component: () => import() 按需加载……', body: '<h3>懒加载</h3><p><code>component: () => import("../views/X.vue")</code> 首屏只加载当前页。</p><h3>守卫</h3><p>全局 <code>beforeEach</code> 做鉴权与标题设置。</p>' },
  { id: 11, folder: 'vue', title: 'v-model 与表单绑定', updated: '2026-07-18', tags: ['基础'], excerpt: 'v-model 是 value + input 事件的语法糖……', body: '<h3>原理</h3><p><code>v-model</code> 等价于 <code>:value</code> + <code>@input</code>（组件内为 <code>modelValue</code>/<code>update:modelValue</code>）。</p>' },
  { id: 12, folder: 'misc', title: 'Git 常用命令速查', updated: '2026-06-30', tags: ['工具'], excerpt: 'commit/checkout/reset 的区别与常用场景……', body: '<h3>常用</h3><p><code>git add .</code> → <code>git commit -m</code> → <code>git push</code>。回退用 <code>git reset</code> 或 <code>git revert</code>。</p>' }
];

const state = { variant: new URLSearchParams(location.search).get('variant') || 'A', folder: 'all', kw: '', current: 1, modal: false, mtab: 'paste', collapsed: false, reader: false, tagInput: false };
const app = document.getElementById('app');
const VARIANT_LABELS = { A: 'A · 双栏书架', B: 'B · 两栏阅读流' };
const ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hl(text, kw) {
  const s = esc(text);
  if (!kw) return s;
  const idx = s.toLowerCase().indexOf(kw.toLowerCase());
  if (idx === -1) return s;
  return s.slice(0, idx) + '<mark class="hl">' + s.slice(idx, idx + kw.length) + '</mark>' + s.slice(idx + kw.length);
}
function filtered() {
  return NOTES.filter(n => (state.folder === 'all' || n.folder === state.folder) &&
    (!state.kw || (n.title + n.excerpt + n.tags.join(' ')).toLowerCase().includes(state.kw.toLowerCase())));
}
function tagsHtml(tags) { return '<div class="tags">' + tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>'; }
function tagEditHtml(tags) { return tags.map(t => '<button class="tag" data-tag="' + esc(t) + '">' + esc(t) + '<span class="tag-rem">✕</span></button>').join(''); }
function tagEditorHtml(tags) {
  return '<div class="tag-editor">' + tagEditHtml(tags) + '<button class="tag-add" id="tag-add">＋ 标签</button>' +
    (state.tagInput ? '<input class="tag-input" id="tag-input" placeholder="回车添加">' : '') + '</div>';
}
function noteMeta(n) { return n.updated + ' · ' + FOLDERS.find(f => f.id === n.folder).name; }
function folderName(id) { return FOLDERS.find(f => f.id === id).name; }

function importModal() {
  const tabs = [['paste', '粘贴新建'], ['upload', '上传文件'], ['folder', '批量导入文件夹']]
    .map(([k, l]) => '<button class="modal-tab' + (state.mtab === k ? ' active' : '') + '" data-tab="' + k + '">' + l + '</button>').join('');
  let body;
  if (state.mtab === 'paste') {
    body = '<div class="field"><label>笔记标题</label><input placeholder="例如：Vue3 依赖注入"></div>' +
      '<div class="field"><label>目标文件夹</label><select><option>Python 笔记</option><option>Vue3 笔记</option><option>未分类</option></select></div>' +
      '<div class="field"><label>正文（Markdown）</label><textarea placeholder="支持 Markdown 语法…"></textarea></div>';
  } else if (state.mtab === 'upload') {
    body = '<div class="field"><label>目标文件夹</label><select><option>Python 笔记</option><option>Vue3 笔记</option><option>未分类</option></select></div>' +
      '<div class="drop">点击选择或拖拽 .md 文件到此处（可多选）</div>';
  } else {
    body = '<div class="field"><label>选择本地文件夹（保留目录结构）</label>' +
      '<div class="tree-demo"><div class="row">▸ 学习笔记/</div>' +
      '<div class="row sel">　▸ Python 笔记/（6 篇 .md）</div>' +
      '<div class="row">　　▸ Vue3 笔记/（5 篇 .md）</div>' +
      '<div class="row">　▸ README.md</div></div></div>' +
      '<div class="field"><label>导入后按文件夹自动分组，同名笔记提示覆盖或跳过</label></div>';
  }
  return '<div class="modal-mask"><div class="modal"><div class="modal-head"><h3>导入笔记</h3></div>' +
    '<div class="modal-tabs">' + tabs + '</div>' + body +
    '<div class="modal-foot"><button class="btn" id="m-cancel">取消</button><button class="btn btn-primary">导入</button></div></div></div>';
}

function variantA() {
  const list = filtered();
  const cur = NOTES.find(n => n.id === state.current);
  const expand = state.collapsed ? '<button class="expand-btn" id="expand" title="展开侧栏">» 展开</button>' : '';
  return '<div class="page a"><header class="bar"><div class="bar-main"><h1>学习笔记</h1><input class="search" placeholder="全文检索：标题、正文、标签…" value="' + esc(state.kw) + '"></div><button class="btn-primary" id="import">＋ 导入笔记</button></header>' +
    '<div class="a-pane' + (state.collapsed ? ' collapsed' : '') + '">' +
    '<aside class="panel a-side"><div class="side-head"><h2>文件夹<span class="count">' + NOTES.length + '</span></h2><button class="collapse-btn" id="collapse" title="收起侧栏">«</button></div>' +
    '<button class="folder' + (state.folder === 'all' ? ' active' : '') + '" data-folder="all"><span class="f-icon">▤</span>全部笔记<span class="count">' + NOTES.length + '</span></button>' +
    FOLDERS.map(f => '<button class="folder' + (state.folder === f.id ? ' active' : '') + '" data-folder="' + f.id + '"><span class="f-icon">▸</span>' + esc(f.name) + '<span class="count">' + f.count + '</span></button>').join('') +
    '<div class="side-divider"></div>' +
    '<h2>笔记<span class="count">' + list.length + '</span></h2>' +
    list.map(n => '<button class="note-item' + (n.id === state.current ? ' active' : '') + '" data-note="' + n.id + '"><div class="t">' + hl(n.title, state.kw) + '</div><div class="x">' + hl(n.excerpt, state.kw) + '</div>' + tagsHtml(n.tags) + '</button>').join('') +
    '</aside>' +
    '<article class="panel reader"><div class="reader-top"><h2 class="editable" contenteditable="true" spellcheck="false">' + esc(cur.title) + '</h2><div class="reader-actions">' +
    '<button class="icon-btn danger" title="删除">' + ICON_TRASH + '</button></div></div>' +
    '<div class="meta"><span>' + noteMeta(cur) + '</span></div>' + tagEditorHtml(cur.tags) +
    '<div class="body editable" contenteditable="true" spellcheck="false">' + cur.body + '</div></article>' +
    '</div></div>' + expand + (state.modal ? importModal() : '');
}

function variantB() {
  const list = filtered();
  const cur = NOTES.find(n => n.id === state.current);
  const chips = [['all', '全部']].concat(FOLDERS.map(f => [f.id, f.name])).map(([k, l]) =>
    '<button class="chip' + (state.folder === k ? ' active' : '') + '" data-folder="' + k + '">' + l + '</button>').join('');
  const readerMask = '<div class="modal-mask" id="reader-mask"><div class="letter"><div class="letter-top"><h2 class="editable" contenteditable="true" spellcheck="false">' + esc(cur.title) + '</h2><div class="reader-actions">' +
    '<button class="icon-btn danger" title="删除">' + ICON_TRASH + '</button>' +
    '<button class="icon-btn" id="m-close" title="关闭">' + ICON_CLOSE + '</button></div></div>' +
    '<div class="meta">' + noteMeta(cur) + '</div>' + tagEditorHtml(cur.tags) +
    '<div class="reader"><div class="body editable" contenteditable="true" spellcheck="false">' + cur.body + '</div></div></div></div>';
  return '<div class="page b"><header class="bar"><div class="bar-main"><h1>学习笔记</h1><input class="search" placeholder="全文检索：标题、正文、标签…" value="' + esc(state.kw) + '"></div><button class="btn-primary" id="import">＋ 导入笔记</button></header>' +
    '<div class="b-chips">' + chips + '</div>' +
    '<div class="b-cards">' + list.map(n =>
      '<button class="b-card" data-note="' + n.id + '"><div class="t">' + hl(n.title, state.kw) + '</div><div class="x">' + hl(n.excerpt, state.kw) + '</div><div class="m">' + noteMeta(n) + '</div>' + tagsHtml(n.tags) + '</button>').join('') + '</div>' +
    (state.modal ? importModal() : '') + (state.reader ? readerMask : '') + '</div>';
}

function render() {
  app.innerHTML = state.variant === 'A' ? variantA() : variantB();
  app.insertAdjacentHTML('beforeend',
    '<div class="switcher"><button id="prev" aria-label="上一个变体">←</button><span class="label">' + VARIANT_LABELS[state.variant] + '</span><button id="next" aria-label="下一个变体">→</button></div>');
}

function wire() {
  app.querySelectorAll('.search').forEach(el => el.addEventListener('input', () => { state.kw = el.value; render(); wire(); }));
  app.querySelectorAll('[data-folder]').forEach(el => el.addEventListener('click', () => { state.folder = el.dataset.folder; render(); wire(); }));
  app.querySelectorAll('[data-note]').forEach(el => el.addEventListener('click', () => { state.current = +el.dataset.note; if (state.variant === 'B') state.reader = true; render(); wire(); }));
  const imp = app.querySelector('#import');
  if (imp) imp.addEventListener('click', () => { state.modal = true; render(); wire(); });
  const col = app.querySelector('#collapse');
  if (col) col.addEventListener('click', () => { state.collapsed = true; render(); wire(); });
  const exp = app.querySelector('#expand');
  if (exp) exp.addEventListener('click', () => { state.collapsed = false; render(); wire(); });
  const tagAdd = app.querySelector('#tag-add');
  if (tagAdd) tagAdd.addEventListener('click', () => { state.tagInput = true; render(); wire(); const inp = app.querySelector('#tag-input'); if (inp) inp.focus(); });
  const tagInput = app.querySelector('#tag-input');
  if (tagInput) tagInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()) {
      const t = e.target.value.trim();
      const cur = NOTES.find(n => n.id === state.current);
      if (!cur.tags.includes(t)) cur.tags.push(t);
      state.tagInput = false;
      render(); wire();
    }
  });
  app.querySelectorAll('[data-tag]').forEach(el => el.addEventListener('click', () => {
    const cur = NOTES.find(n => n.id === state.current);
    cur.tags = cur.tags.filter(t => t !== el.dataset.tag);
    render(); wire();
  }));
  app.querySelectorAll('.modal-tab').forEach(el => el.addEventListener('click', () => { state.mtab = el.dataset.tab; render(); wire(); }));
  app.querySelectorAll('.modal-mask').forEach(mask => mask.addEventListener('click', e => {
    if (e.target === mask) { if (mask.id === 'reader-mask') { state.reader = false; } else { state.modal = false; } render(); wire(); }
  }));
  app.querySelectorAll('#m-cancel').forEach(el => el.addEventListener('click', () => { state.modal = false; render(); wire(); }));
  app.querySelectorAll('#m-close').forEach(el => el.addEventListener('click', () => { state.reader = false; render(); wire(); }));
  app.querySelectorAll('.modal form').forEach(f => f.addEventListener('submit', e => { e.preventDefault(); state.modal = false; render(); wire(); }));
  app.querySelector('#prev').addEventListener('click', () => cycle(-1));
  app.querySelector('#next').addEventListener('click', () => cycle(1));
}
function cycle(d) {
  const keys = ['A', 'B'];
  const i = keys.indexOf(state.variant);
  state.variant = keys[(i + d + keys.length) % keys.length];
  history.replaceState(null, '', '?variant=' + state.variant);
  render(); wire();
}
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render(); wire();
</script>
</body>
</html>
