<!doctype html>
<!--
  P1 学习模块合体原型（PROTOTYPE，可丢弃）
  目标：验证「侧边栏只有一个『笔记』入口，内部用页签切换 学习笔记 / 问答 / 答题」的导航形态。
  结构：左侧为全站导航（首页/计划/日记/番茄钟/导航/笔记，笔记高亮），右侧页面内页签切换三个子页面。
  三个子页面以 iframe 内嵌（默认变体：笔记 B、问答 A、答题 C；原型内仍可切换变体）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1 学习模块 · 合体原型 · design-mockups/learn</title>
<style>
  :root {
    --paper: #f7f5f1; --paper-soft: #f4f1ea; --card: #fffefc; --hairline: #e9e3d9;
    --ink: #2b2622; --sub: #7c7468; --teal: #0e7c74; --teal-dark: #0a6a63; --teal-soft: #e7f1ef;
    --serif: "Songti SC", "STSong", SimSun, serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b2622; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--teal); }
  button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
  h1, h2 { font-family: var(--serif); font-weight: 700; margin: 0; }

  .shell { display: flex; height: 100vh; }
  /* ---------- 左侧全站导航 ---------- */
  .side { width: 216px; flex-shrink: 0; background: var(--paper-soft); border-right: 1px solid var(--hairline); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
  .brand { font-family: var(--serif); font-size: 19px; letter-spacing: 3px; margin-bottom: 18px; padding: 0 10px; }
  .nav-item { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; color: var(--sub); }
  .nav-item:hover { background: var(--card); color: var(--ink); }
  .nav-item.active { background: var(--teal); color: #fff; font-weight: 600; }
  .nav-item .ico { font-size: 16px; line-height: 1; }

  /* ---------- 右侧主区 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 18px; padding: 14px 24px; border-bottom: 1px solid var(--hairline); background: rgba(247, 245, 241, .92); }
  .topbar h1 { font-size: 20px; letter-spacing: 2px; }
  .tabs { display: flex; gap: 6px; background: var(--paper-soft); border-radius: 12px; padding: 4px; margin-left: auto; }
  .tab { padding: 7px 20px; border-radius: 9px; font-size: 14px; color: var(--sub); }
  .tab.active { background: var(--card); color: var(--teal-dark); font-weight: 600; box-shadow: 0 1px 3px rgba(43, 38, 34, .08); }
  .frame-wrap { flex: 1; min-height: 0; padding: 14px 18px 18px; }
  iframe { width: 100%; height: 100%; border: 1px solid var(--hairline); border-radius: 14px; background: var(--card); }

  .note { position: fixed; bottom: 14px; right: 18px; font-size: 12px; color: var(--sub); background: var(--card); border: 1px solid var(--hairline); border-radius: 999px; padding: 5px 12px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">个人网站</div>
    <button class="nav-item">首页</button>
    <button class="nav-item">计划</button>
    <button class="nav-item">日记</button>
    <button class="nav-item">番茄钟</button>
    <button class="nav-item">导航</button>
    <button class="nav-item active">笔记</button>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1>笔记</h1>
      <div class="tabs">
        <button class="tab active" data-tab="notes">学习笔记</button>
        <button class="tab" data-tab="qa">问答</button>
        <button class="tab" data-tab="quiz">答题</button>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="学习模块子页面"></iframe>
    </div>
  </main>
</div>
<script>
const SRC = {
  notes: 'notes.html?variant=B',
  qa: 'qa.html?variant=A',
  quiz: 'quiz.html?variant=C'
};
const frame = document.getElementById('frame');
function select(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  frame.src = SRC[tab];
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => select(t.dataset.tab)));
select('notes');
</script>
</body>
</html>
