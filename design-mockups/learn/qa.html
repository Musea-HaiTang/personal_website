<!doctype html>
<!--
  笔记问答页原型（PROTOTYPE，可丢弃）
  问题：基于学习笔记的问答界面，哪种结构最顺手？
  - A「左列表 + 对话」：左侧按「项目 / 最近」两级分组——项目下挂多个对话，最近区为不分类的散问答；中间对话流，底部输入；回答内嵌引用来源标签
  - B「全屏对话 + 右引用栏」：顶部会话切换，主区对话，右侧固定引用来源面板
  - C「对话流 + 脚注来源」：居中窄对话，回答以 [1][2] 脚注标注来源，回答下方列出来源
  三变体均有「＋ 新对话」入口：新对话显示引导文字 + 输入框（发送按钮在框内、带提示词）；左侧项目行带文件夹图标、可点击展开/收起，项目与其下对话同一行样式。
  只读演示：切换会话、新对话、发送问题后模拟一条带引用的回答（无真实模型调用）。
  沿用手站「纸感」主题。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问答页原型 · 学习笔记问答 · design-mockups/learn</title>
<style>
  :root {
    --paper: #f7f5f1; --paper-soft: #f4f1ea; --card: #fffefc; --hairline: #e9e3d9;
    --ink: #2b2622; --sub: #7c7468; --teal: #0e7c74; --teal-dark: #0a6a63; --teal-soft: #e7f1ef;
    --amber: #b7791f; --amber-soft: #faf1dd;
    --serif: "Songti SC", "STSong", SimSun, serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b2622; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--teal); }
  button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 700; margin: 0; }
  .count { font-size: 12px; color: var(--sub); background: var(--paper-soft); border-radius: 999px; padding: 1px 9px; }

  .page { max-width: 1200px; margin: 0 auto; padding: 26px 24px 90px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
  .bar h1 { font-size: 22px; letter-spacing: 2px; }

  .msg { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
  .msg.u { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .avatar.u { background: var(--teal); color: #fff; }
  .avatar.a { background: var(--paper-soft); border: 1px solid var(--hairline); color: var(--sub); }
  .bubble { background: var(--card); border: 1px solid var(--hairline); border-radius: 4px 12px 12px 12px; padding: 11px 14px; max-width: 720px; }
  .bubble.u { max-width: 640px; }
  .bubble.u { background: var(--teal-soft); border-color: transparent; border-radius: 12px 4px 12px 12px; }
  .cite { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--hairline); background: var(--paper-soft); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--teal-dark); margin-right: 6px; }
  .cite:hover { border-color: var(--teal); }
  .foot { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .foot .src { display: block; margin-top: 3px; color: var(--teal-dark); }

  .composer { flex: 1; display: flex; border: 1px solid var(--hairline); border-radius: 12px; background: var(--card); padding: 8px 12px; }
  .composer textarea { flex: 1; border: 0; background: transparent; padding: 0; font: inherit; font-size: 14px; resize: none; min-height: 40px; }
  .composer textarea:focus { outline: none; box-shadow: none; }
  .send { border-radius: 999px; background: var(--teal); color: #fff; padding: 8px 18px; font-weight: 500; }
  .send:hover { background: var(--teal-dark); }

  /* A：左列表 + 对话 */
  .a-wrap { display: grid; grid-template-columns: 250px 1fr; gap: 14px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--hairline); border-radius: 14px; padding: 12px; }
  .conv { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; font-size: 14px; }
  .conv:hover { background: var(--paper-soft); }
  .conv.active { background: var(--teal-soft); color: var(--teal-dark); font-weight: 600; }
  .conv .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .new-conv-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 1.5px dashed var(--teal); border-radius: 10px; background: var(--teal-soft); color: var(--teal-dark); padding: 9px; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .new-conv-btn:hover { background: var(--teal); color: #fff; border-style: solid; }
  .conv-group-title { font-size: 12px; color: var(--sub); margin: 12px 6px 4px; letter-spacing: 1px; }
  .proj-row { justify-content: flex-start; font-weight: 600; color: var(--ink); cursor: pointer; }
  .proj-icon { display: grid; place-items: center; color: var(--teal); }
  .proj-icon svg { width: 16px; height: 16px; }
  .proj-new { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--sub); margin-left: auto; }
  .proj-new:hover { color: var(--teal); background: var(--paper-soft); }
  .proj-new svg { width: 13px; height: 13px; }
  .proj-chevron { margin-left: 4px; color: var(--sub); font-size: 12px; }
  .proj-row .t { overflow: visible; white-space: nowrap; }
  .proj-child .conv { padding-left: 34px; }
  .chat { padding: 8px 4px 0; }
  .composer-wrap { display: flex; align-items: flex-end; gap: 8px; background: var(--card); border: 1px solid var(--hairline); border-radius: 14px; padding: 10px; }
  .empty { padding: 60px 24px; }
  .empty-title { text-align: center; font-size: 21px; margin-bottom: 6px; }
  .empty-sub { text-align: center; color: var(--sub); font-size: 13.5px; margin: 0 0 24px; }
  .btn { border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 7px 14px; font-size: 13px; }
  .btn:hover { border-color: var(--teal); color: var(--teal); }

  /* B：全屏对话 + 右引用栏 */
  .b-wrap { display: grid; grid-template-columns: 1fr 300px; gap: 14px; align-items: start; }
  .b-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .b-top select { border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 7px 12px; font-size: 14px; }
  .src-card { border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
  .src-card .t { font-size: 13px; font-weight: 600; color: var(--teal-dark); }
  .src-card .x { font-size: 12px; color: var(--sub); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .src-card .m { font-size: 11px; color: var(--sub); margin-top: 4px; }

  /* C：对话流 + 脚注来源 */
  .c-wrap { max-width: 760px; margin: 0 auto; }
  .c-new { position: fixed; top: 22px; right: 26px; border-radius: 999px; background: var(--teal); color: #fff; padding: 8px 16px; font-size: 14px; z-index: 30; }
  .c-new:hover { background: var(--teal-dark); }
  .c-title { text-align: center; font-size: 15px; color: var(--sub); margin-bottom: 16px; }
  .cite-n { font-size: 12px; color: var(--teal); vertical-align: super; }
  .footnote { border-top: 1px dashed var(--hairline); margin-top: 10px; padding-top: 8px; }

  .variant { display: none; }
  .variant.show { display: block; }
  .switcher { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; box-shadow: 0 8px 24px rgba(43, 38, 34, .3); font-size: 14px; }
  .switcher button { color: #fff; font-size: 18px; line-height: 1; padding: 0 4px; }
  .switcher .label { min-width: 210px; text-align: center; }

  @media (max-width: 900px) { .a-wrap, .b-wrap { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const CONVS = [
  { id: 1, title: 'Python 装饰器怎么理解？', msgs: [
    { role: 'u', text: 'Python 装饰器到底是怎么工作的？能简单讲讲吗？' },
    { role: 'a', text: '装饰器本质是「接收一个函数、返回一个新函数」的可调用对象。写 @timer 等价于执行 f = timer(f)。常见用途是给函数统一加日志、计时、权限校验，而不改动原函数内部代码。', cites: ['Python 笔记 · 装饰器原理与应用'], refs: '基于《装饰器原理与应用》等 1 篇笔记' }
  ]},
  { id: 2, title: 'Vue3 响应式原理', msgs: [
    { role: 'u', text: 'Vue3 的 ref 和 reactive 有什么区别？' },
    { role: 'a', text: 'reactive 用 Proxy 代理对象，适合对象/数组；ref 用对象包装基本类型，通过 .value 读写，模板中会自动解包。底层都是「读取时收集依赖、写入时触发更新」。', cites: ['Vue3 笔记 · 响应式原理 ref/reactive'], refs: '基于《响应式原理 ref/reactive》等 1 篇笔记' }
  ]},
  { id: 3, title: '生成器和迭代器的区别', msgs: [
    { role: 'u', text: '生成器与迭代器有什么区别？' },
    { role: 'a', text: '迭代器是实现了 __iter__ 和 __next__ 协议的对象；生成器是函数内出现 yield 后形成的更易写的迭代器，状态自动保存，惰性求值。', cites: ['Python 笔记 · 生成器与迭代器'], refs: '基于《生成器与迭代器》等 1 篇笔记' }
  ]},
  { id: 4, title: 'Promise 和 async 的区别？', msgs: [
    { role: 'u', text: '前端里 Promise 和 async/await 有什么区别？' },
    { role: 'a', text: 'async/await 是 Promise 的语法糖，让异步代码看起来像同步；两者底层是同一套机制，await 只能在 async 函数内使用。', cites: [], refs: '' }
  ]}
];
const PROJECTS = [
  { name: 'Python 基础', convs: [1, 3] },
  { name: 'Vue3 原理', convs: [2] }
];
const SAMPLE_REPLY = {
  text: '根据你的笔记：组合式 API 把组件逻辑按功能组织在 setup 中，配合 ref/computed/watch 做响应式派生；Pinia 用于跨组件共享状态，通过 defineStore 定义 state 与 actions。',
  cites: ['Vue3 笔记 · 组合式 API 与 setup', 'Vue3 笔记 · Pinia 状态管理'],
  refs: '基于 2 篇笔记'
};
const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4.2a2 2 0 0 1 1.6.8L12 6.5h7a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></svg>';

const state = { variant: new URLSearchParams(location.search).get('variant') || 'A', conv: 1, sending: false, newId: 4, projOpen: {} };
const app = document.getElementById('app');
const VARIANT_LABELS = { A: 'A · 左列表 + 对话', B: 'B · 全屏 + 右引用栏', C: 'C · 对话流 + 脚注来源' };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function current() { return CONVS.find(c => c.id === state.conv); }
function msgsHtml(withFootnotes) {
  const c = current();
  if (!c) return '';
  return c.msgs.map(m => {
    const bubble = m.role === 'a' && m.cites
      ? '<div class="bubble">' + (withFootnotes ? footnoteBody(m) : inlineBody(m)) + '</div>'
      : '<div class="bubble' + (m.role === 'u' ? ' u' : '') + '">' + esc(m.text) + '</div>';
    return '<div class="msg' + (m.role === 'u' ? ' u' : '') + '">' + bubble + '</div>';
  }).join('');
}
function emptyHtml() {
  return '<div class="empty"><h2 class="empty-title">想基于学习笔记问点什么？</h2><p class="empty-sub">回答会引用你的笔记作为来源</p><div class="composer-wrap"><div class="composer"><textarea placeholder="基于笔记提问，例如：Vue3 的 computed 什么时候重新计算？"></textarea></div><div class="composer-foot"><button class="send">发送</button></div></div></div>';
}
function isEmpty() { const c = current(); return !c || !c.msgs.length; }
function ask(raw) {
  const q = String(raw ?? '').trim();
  if (!q || state.sending) return;
  let c = current();
  if (!c) {
    state.conv = ++state.newId;
    c = { id: state.conv, title: q.length > 14 ? q.slice(0, 14) + '…' : q, msgs: [] };
    CONVS.push(c);
  }
  if (c.msgs.length === 0 && c.title === '新对话') c.title = q.length > 14 ? q.slice(0, 14) + '…' : q;
  c.msgs.push({ role: 'u', text: q });
  render(); wire();
  state.sending = true;
  setTimeout(() => {
    const cc = current();
    cc.msgs.push({ role: 'a', text: SAMPLE_REPLY.text, cites: SAMPLE_REPLY.cites, refs: SAMPLE_REPLY.refs });
    state.sending = false;
    render(); wire();
  }, 700);
}
function inlineBody(m) {
  return esc(m.text) + '<div class="foot">' + m.cites.map(c => '<span class="cite">引用 · ' + esc(c) + '</span>').join('') + '<br><span class="src">' + esc(m.refs) + '</span></div>';
}
function footnoteBody(m) {
  const n = m.cites.map((c, i) => i + 1);
  return esc(m.text) + n.map(i => '<sup class="cite-n">[' + i + ']</sup>').join('') +
    '<div class="footnote">' + m.cites.map((c, i) => '<span class="src">[' + (i + 1) + '] ' + esc(c) + '</span>').join('') + '</div>';
}

function variantA() {
  const inProjects = id => PROJECTS.some(p => p.convs.includes(id));
  const recent = CONVS.filter(c => !inProjects(c.id));
  const convBtn = c => '<button class="conv' + (c.id === state.conv ? ' active' : '') + '" data-conv="' + c.id + '"><span class="t">' + esc(c.title) + '</span></button>';
  return '<div class="page a"><header class="bar"><h1>笔记问答</h1><span class="count">基于你的学习笔记回答</span></header>' +
    '<div class="a-wrap"><aside class="panel">' +
    '<button class="new-conv-btn" id="new-conv">＋ 新对话</button>' +
    '<div class="conv-group-title">项目</div>' +
    PROJECTS.map(p => {
      const open = state.projOpen[p.name] !== false;
      return '<div class="conv proj-row" data-proj="' + esc(p.name) + '"><span class="proj-icon">' + ICON_FOLDER + '</span><span class="t">' + esc(p.name) + '</span>' +
        '<button class="proj-new" data-new-proj="' + esc(p.name) + '" title="从该项目开始新对话">' + ICON_EDIT + '</button>' +
        '<span class="proj-chevron">' + (open ? '▾' : '▸') + '</span></div>' +
        (open ? '<div class="proj-child">' + p.convs.map(id => convBtn(CONVS.find(c => c.id === id))).join('') + '</div>' : '');
    }).join('') +
    '<div class="conv-group-title">最近</div>' + recent.map(convBtn).join('') +
    '</aside><section>' + (isEmpty()
      ? emptyHtml()
      : '<div class="chat">' + msgsHtml(false) + '</div>' +
        '<div class="composer-wrap"><div class="composer"><textarea placeholder="基于笔记提问，例如：Vue3 的 computed 什么时候重新计算？"></textarea></div><div class="composer-foot"><button class="send">发送</button></div></div>') + '</section></div></div>';
}
function variantB() {
  const c = current();
  const srcs = c ? c.msgs.filter(m => m.role === 'a' && m.cites).flatMap(m => m.cites) : [];
  return '<div class="page b"><header class="bar"><div><h1>笔记问答</h1><div class="b-top"><select>' +
    CONVS.map(c => '<option' + (c.id === state.conv ? ' selected' : '') + '>' + esc(c.title) + '</option>').join('') +
    '</select><button class="btn" id="new-conv-b">＋ 新对话</button><span class="count">回答基于检索到的笔记片段</span></div></div></header>' +
    '<div class="b-wrap"><section>' + (isEmpty()
      ? emptyHtml()
      : '<div class="chat">' + msgsHtml(false) + '</div>' +
        '<div class="composer-wrap"><div class="composer"><textarea placeholder="继续追问…"></textarea></div><div class="composer-foot"><button class="send">发送</button></div></div>') + '</section>' +
    '<aside class="panel"><h3 style="font-size:15px;margin-bottom:10px;">引用来源<span class="count">' + srcs.length + '</span></h3>' +
    srcs.map((s, i) => '<div class="src-card"><div class="t">' + esc(s) + '</div><div class="x">…装饰器本质是一个接收函数并返回新函数的可调用对象，常见场景是日志、计时、权限校验…</div><div class="m">命中 2 处 · 2026-08-14</div></div>').join('') +
    '</aside></div></div>';
}
function variantC() {
  return '<div class="page c"><button class="c-new">＋ 新对话</button>' +
    '<div class="c-wrap"><h2 class="c-title">' + esc(current() ? current().title : '新对话') + '</h2>' +
    (isEmpty() ? emptyHtml() : '<div class="chat">' + msgsHtml(true) + '</div>' +
      '<div class="composer-wrap"><div class="composer"><textarea placeholder="继续追问…"></textarea></div><div class="composer-foot"><button class="send">发送</button></div></div>') + '</div></div>';
}

function render() {
  app.innerHTML = state.variant === 'A' ? variantA() : state.variant === 'B' ? variantB() : variantC();
  app.insertAdjacentHTML('beforeend',
    '<div class="switcher"><button id="prev" aria-label="上一个变体">←</button><span class="label">' + VARIANT_LABELS[state.variant] + '</span><button id="next" aria-label="下一个变体">→</button></div>');
}
function wire() {
  app.querySelectorAll('[data-conv]').forEach(el => el.addEventListener('click', () => { state.conv = +el.dataset.conv; render(); wire(); }));
  app.querySelectorAll('[data-proj]').forEach(el => el.addEventListener('click', () => { const name = el.dataset.proj; state.projOpen[name] = state.projOpen[name] === false; render(); wire(); }));
  app.querySelectorAll('[data-new-proj]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const pname = el.dataset.newProj;
    const proj = PROJECTS.find(p => p.name === pname);
    const conv = { id: ++state.newId, title: '新对话', msgs: [] };
    CONVS.push(conv);
    proj.convs.push(conv.id);
    state.conv = conv.id;
    state.projOpen[pname] = true;
    render(); wire();
  }));
  app.querySelectorAll('.b-top select').forEach(el => el.addEventListener('change', () => { state.conv = CONVS.findIndex(c => c.title === el.value) + 1; render(); wire(); }));
  app.querySelectorAll('#new-conv, #new-conv-b, .c-new').forEach(el => el.addEventListener('click', () => { state.conv = 0; render(); wire(); }));
  app.querySelectorAll('.composer').forEach(cp => {
    const ta = cp.querySelector('textarea');
    const btn = cp.querySelector('.send');
    const submit = () => { ask(ta.value); ta.value = ''; };
    btn.addEventListener('click', submit);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  });
  app.querySelector('#prev').addEventListener('click', () => cycle(-1));
  app.querySelector('#next').addEventListener('click', () => cycle(1));
}
function cycle(d) {
  const keys = ['A', 'B', 'C'];
  const i = keys.indexOf(state.variant);
  state.variant = keys[(i + d + keys.length) % keys.length];
  history.replaceState(null, '', '?variant=' + state.variant);
  render(); wire();
}
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
render(); wire();
</script>
</body>
</html>
