<!doctype html>
<!--
  导航页「C — 书签墙」原型（PROTOTYPE，可丢弃）
  顶部固定搜索栏（搜索标题、分类或网址）+ 常用胶囊条（仅网站图标）+ 分类分带密集铺开。
  已按用户意见（2026-08-16）：
    - 去掉 A/B 变体与底部切换条，只保留 C；
    - 分类头去掉「添加链接 / 重命名 / 删除」按钮，数量徽标紧跟分类名右侧；
    - 磁贴的「编辑 / 删除」合并为单个编辑图标（用户提供的 SVG），悬停动画不变；
    - 常用胶囊右上角增加编辑图标；
    - 顶栏「新建分类 / 新建链接」合并为「新增」图标 + 文字按钮（用户提供的 SVG）。
    - 点击「新增」弹出新建分类 / 新建链接弹窗（原型演示，不做持久化）。
  只读展示：搜索即时过滤并高亮；favicon 加载失败回退（胶囊 → 地球图标，磁贴 → 首字母色块）。
  沿用手站「纸感」主题（frontend/tailwind.config.js 色板与衬线字体）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导航页原型 · C 书签墙 · design-mockups/nav</title>
<style>
  :root {
    --paper: #f7f5f1;
    --paper-soft: #f4f1ea;
    --card: #fffefc;
    --hairline: #e9e3d9;
    --ink: #2b2622;
    --sub: #7c7468;
    --teal: #0e7c74;
    --teal-dark: #0a6a63;
    --teal-soft: #e7f1ef;
    --amber: #b7791f;
    --amber-soft: #faf1dd;
    --red: #c4533a;
    --red-soft: #f9ebe5;
    --serif: "Songti SC", "STSong", SimSun, serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button {
    font: inherit;
    border: 0;
    background: none;
    cursor: pointer;
    color: inherit;
  }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
  mark.hl { background: var(--amber-soft); color: var(--amber); border-radius: 2px; padding: 0 1px; }

  .page { max-width: 1120px; margin: 0 auto; padding: 40px 28px 90px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 700; margin: 0; }

  /* ---------- 通用小组件 ---------- */
  .search {
    width: 100%;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: var(--card);
    padding: 10px 14px;
    font-size: 14px;
    color: var(--ink);
  }
  .search::placeholder { color: var(--sub); }
  .search:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
  .sec-title { font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .count {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--sub);
    background: var(--paper-soft);
    border-radius: 999px;
    padding: 1px 9px;
  }

  .tile-icon {
    position: relative;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--bg, var(--teal-soft));
    color: var(--fg, var(--teal-dark));
    overflow: hidden;
    border: 1px solid var(--hairline);
  }
  .tile-icon img { width: 24px; height: 24px; object-fit: contain; }
  .tile-icon .mono {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 700;
    line-height: 1;
  }
  .tile-icon img[data-hidden="1"] { display: none; }
  /* favicon 加载成功时不再叠加首字母；失败时显示兜底 */
  .tile-icon img:not([data-hidden="1"]) + .mono { display: none; }
  .tile-icon .fallback { display: none; }
  .tile-icon img[data-hidden="1"] + .fallback { display: block; }

  /* ---------- 顶部固定栏 ---------- */
  .vc-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(247, 245, 241, .92);
    backdrop-filter: blur(6px);
    padding: 16px 0;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
  }
  .vc-bar h1 { font-size: 22px; letter-spacing: 2px; }
  .vc-bar-main { display: flex; align-items: center; gap: 14px; flex: 1; }
  .vc-bar .search { width: 320px; }
  .vc-bar-actions { display: flex; gap: 10px; }
  .icon-btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    background: var(--teal);
    border: 1px solid var(--teal);
    padding: 8px 16px 8px 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    transition: background .12s ease;
  }
  .icon-btn-primary:hover { background: var(--teal-dark); }
  .icon-btn-primary svg { width: 18px; height: 18px; display: block; }

  /* ---------- 常用胶囊条 ---------- */
  .vc-section { margin-bottom: 26px; }
  .vc-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 12px 2px 16px;
    margin-top: 8px;
  }
  .vc-chip {
    position: relative;
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 8px 14px 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color .14s ease, background .14s ease;
  }
  .vc-chip:hover { border-color: var(--teal); background: var(--teal-soft); }
  .vc-chip-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .vc-chip .tile-icon { width: 24px; height: 24px; border-radius: 50%; }
  .vc-chip .tile-icon img { width: 14px; height: 14px; }
  .vc-chip .mono { font-size: 11px; }
  .vc-chip-title { font-size: 13px; font-weight: 600; white-space: nowrap; }

  /* ---------- 分类分带 ---------- */
  .vc-band {
    margin-bottom: 8px;
    padding-top: 18px;
    border-top: 1px dashed var(--hairline);
  }
  .vc-band-head {
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .vc-band-head h2 { font-size: 16px; }
  .vc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .vc-tile {
    position: relative;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 11px;
    padding: 11px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color .12s ease, background .12s ease;
  }
  .vc-tile:hover { border-color: var(--teal); background: var(--teal-soft); }
  .vc-tile .tile-icon { width: 28px; height: 28px; border-radius: 8px; }
  .vc-tile .tile-icon img { width: 15px; height: 15px; }
  .vc-tile .mono { font-size: 12px; }
  .vc-tile-main { min-width: 0; flex: 1; }
  .vc-tile-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc-tile-domain { font-size: 11px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 右上角编辑图标（悬停淡入，动画与之前一致） ---------- */
  .tile-action-btn {
    position: absolute;
    top: -7px;
    right: -5px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    line-height: 0;
    background: var(--card);
    border: 1px solid var(--hairline);
    display: grid;
    place-items: center;
    color: var(--sub);
    opacity: 0;
    transition: opacity .12s ease, color .12s ease, border-color .12s ease;
  }
  .tile-action-btn svg { width: 12px; height: 12px; display: block; }
  .tile-action-btn:hover { color: var(--teal); border-color: var(--teal); }
  .vc-tile:hover .tile-action-btn,
  .vc-tile:focus-within .tile-action-btn,
  .vc-chip:hover .tile-action-btn,
  .vc-chip:focus-within .tile-action-btn { opacity: 1; }

  /* ---------- 新增弹窗（原型演示） ---------- */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(43, 38, 34, .35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 16px 40px rgba(43, 38, 34, .18);
  }
  .modal-head h3 { font-size: 18px; margin-bottom: 14px; }
  .modal-tabs {
    display: flex;
    gap: 4px;
    background: var(--paper-soft);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .modal-tab {
    flex: 1;
    padding: 7px 0;
    border-radius: 8px;
    font-size: 14px;
    color: var(--sub);
    text-align: center;
  }
  .modal-tab.active { background: var(--card); color: var(--teal-dark); font-weight: 600; box-shadow: 0 1px 3px rgba(43, 38, 34, .08); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: var(--card);
    padding: 9px 12px;
    font-size: 14px;
    color: var(--ink);
  }
  .field input:focus, .field select:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sub); margin-bottom: 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; }
  .btn { border: 1px solid var(--hairline); border-radius: 10px; background: var(--card); padding: 8px 16px; font-size: 14px; color: var(--ink); }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-dark); color: #fff; }

  @media (max-width: 880px) {
    .vc-bar { flex-direction: column; align-items: stretch; gap: 10px; }
    .vc-bar-main { flex-direction: column; align-items: stretch; }
    .vc-bar .search { width: 100%; }
    .vc-bar-actions { justify-content: flex-end; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- 示例数据（模拟后端 /api/nav/categories 返回结构） ---------- */
const DATA = [
  { id: 1, name: '图片生成', links: [
    { id: 1,  title: 'Raphael AI', url: 'https://raphael.app/zh', description: 'AI 图像生成与编辑', is_pinned: true },
    { id: 2,  title: '即梦', url: 'https://jimeng.jianying.com', description: '剪映旗下 AI 创作平台', is_pinned: true },
    { id: 3,  title: 'Ideogram', url: 'https://ideogram.ai', description: '文字排版出色的生图工具', is_pinned: false },
    { id: 4,  title: '通义万相', url: 'https://tongyi.aliyun.com/wanxiang', description: '阿里 AI 绘画', is_pinned: false }
  ]},
  { id: 2, name: '写作助手', links: [
    { id: 5,  title: 'DeepSeek', url: 'https://chat.deepseek.com', description: '深度思考模型对话', is_pinned: true },
    { id: 6,  title: 'Claude', url: 'https://claude.ai', description: 'Anthropic 对话助手', is_pinned: false },
    { id: 7,  title: 'Notion', url: 'https://www.notion.so', description: '笔记与知识库', is_pinned: false }
  ]},
  { id: 3, name: '开发工具', links: [
    { id: 8,  title: 'GitHub', url: 'https://github.com', description: '代码托管与协作', is_pinned: true },
    { id: 9,  title: 'MDN', url: 'https://developer.mozilla.org', description: 'Web 开发文档', is_pinned: false },
    { id: 10, title: 'Vite', url: 'https://vitejs.dev', description: '前端构建工具', is_pinned: false },
    { id: 11, title: 'Stack Overflow', url: 'https://stackoverflow.com', description: '开发者问答社区', is_pinned: false }
  ]},
  { id: 4, name: '日常', links: [
    { id: 12, title: '飞书', url: 'https://www.feishu.cn', description: '团队协作', is_pinned: false },
    { id: 13, title: '百度', url: 'https://www.baidu.com', description: '搜索', is_pinned: false }
  ]}
];

/* ---------- 用户提供的图标（编辑 / 新增） ---------- */
const ICON_EDIT = '<svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M526.41 117.029v58.514a7.314 7.314 0 0 1-7.315 7.314H219.429a36.571 36.571 0 0 0-35.987 29.989l-0.585 6.583V804.57a36.571 36.571 0 0 0 29.989 35.987l6.583 0.585H804.57a36.571 36.571 0 0 0 35.987-29.989l0.585-6.583v-317.44a7.314 7.314 0 0 1 7.314-7.314h58.514a7.314 7.314 0 0 1 7.315 7.314v317.44a109.714 109.714 0 0 1-99.182 109.203l-10.533 0.512H219.43a109.714 109.714 0 0 1-109.203-99.182l-0.512-10.533V219.43a109.714 109.714 0 0 1 99.182-109.203l10.533-0.512h299.666a7.314 7.314 0 0 1 7.314 7.315z m307.345 31.817l41.4 41.399a7.314 7.314 0 0 1 0 10.313L419.985 655.726a7.314 7.314 0 0 1-10.313 0l-41.399-41.4a7.314 7.314 0 0 1 0-10.312l455.168-455.168a7.314 7.314 0 0 1 10.313 0z"/></svg>';
const ICON_ADD = '<svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M512 1023.914667c-281.315556 0-509.269333-229.205333-509.269333-511.943111C2.730667 229.176889 230.684444 0.028444 512 0.028444c281.230222 0 509.240889 229.148444 509.240889 511.943112 0 282.794667-227.925333 511.943111-509.240889 511.943111z m0-955.704889c-243.768889 0-441.372444 198.656-441.372444 443.704889 0 244.963556 197.603556 443.676444 441.372444 443.676444 243.740444 0 441.287111-198.627556 441.344-443.676444 0-245.048889-197.603556-443.704889-441.344-443.704889z m234.382222 473.6h-199.822222l-0.881778 228.721778c0 8.476444 1.820444 44.8-37.432889 44.8-37.262222 0-33.536-23.978667-33.536-42.069334l0.085334-231.395555H255.260444c-14.336 0-31.374222 0.085333-31.374222-43.747556 0-32.568889 39.850667-28.871111 39.850667-28.871111h211.057778V248.547556c0-14.449778 11.121778-27.306667 35.84-25.856 24.718222 1.422222 35.84 11.463111 35.84 25.856v220.700444h199.850666s45.539556-5.944889 45.084445 34.588444c-0.483556 40.561778-35.868444 37.973333-45.027556 37.973334z"/></svg>';

const state = { kw: '', modal: { visible: false, tab: 'link' } };

const app = document.getElementById('app');

/* ---------- 工具函数 ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function domain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
}
function initials(title) { return (title || '').trim().slice(0, 1).toUpperCase() || '?'; }
function colorFor(seed) {
  const palette = [
    ['#e7f1ec', '#2e6b4f'], ['#e7f1ef', '#2d6a5b'], ['#fdf3e3', '#9a641a'],
    ['#f1ecf9', '#6d4da8'], ['#e8effa', '#2f5aa8'], ['#f9ebe5', '#a8442e'],
    ['#e8f4f3', '#0a6a63']
  ];
  let h = 0;
  for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}
function favicon(url) {
  return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain(url)) + '&sz=64';
}
function hl(text, kw) {
  const s = esc(text);
  if (!kw) return s;
  const idx = s.toLowerCase().indexOf(kw.toLowerCase());
  if (idx === -1) return s;
  return s.slice(0, idx) + '<mark class="hl">' + s.slice(idx, idx + kw.length) + '</mark>' + s.slice(idx + kw.length);
}
function matches(link, kw, catName) {
  if (!kw) return true;
  const hay = (link.title + ' ' + link.url + ' ' + (link.description || '') + ' ' + (catName || '')).toLowerCase();
  return hay.includes(kw.toLowerCase());
}
function iconHtml(link, opts) {
  opts = opts || {};
  const [bg, fg] = colorFor(link.title);
  const fallback = opts.iconOnly
    ? '<span class="fallback"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.2 3.4 3.2 14.2 0 18M12 3c-3.2 3.4-3.2 14.2 0 18"/></svg></span>'
    : '<span class="mono">' + esc(initials(link.title)) + '</span>';
  return '<span class="tile-icon" style="--bg:' + bg + ';--fg:' + fg + '">' +
    '<img src="' + esc(favicon(link.url)) + '" alt="" loading="lazy" data-title="' + esc(link.title) + '">' +
    fallback + '</span>';
}

function modalHtml() {
  const isCat = state.modal.tab === 'category';
  const tabBtn = (tab, label) =>
    '<button type="button" class="modal-tab' + (state.modal.tab === tab ? ' active' : '') + '" data-tab="' + tab + '">' + label + '</button>';
  const foot = '<div class="modal-foot"><button type="button" class="btn" id="modal-cancel">取消</button><button type="submit" class="btn btn-primary">保存</button></div>';
  let body;
  if (isCat) {
    body = '<div class="field"><label>分类名称</label><input type="text" placeholder="例如：图片生成"></div>';
  } else {
    body =
      '<div class="field"><label>标题</label><input type="text" placeholder="链接名称"></div>' +
      '<div class="field"><label>URL</label><input type="url" placeholder="https://"></div>' +
      '<div class="field"><label>描述（可选）</label><input type="text"></div>' +
      '<div class="field"><label>分类</label><select>' + DATA.map((c) => '<option>' + esc(c.name) + '</option>').join('') + '</select></div>' +
      '<label class="check-row"><input type="checkbox"> 置顶</label>';
  }
  return '<div class="modal-mask"><div class="modal">' +
    '<div class="modal-head"><h3>新增</h3></div>' +
    '<div class="modal-tabs">' + tabBtn('category', '新建分类') + tabBtn('link', '新建链接') + '</div>' +
    '<form>' + body + foot + '</form></div></div>';
}

/* ---------- C：书签墙 ---------- */
function render() {
  const kw = state.kw;
  const pinned = DATA.flatMap((c) => c.links).filter((l) => l.is_pinned && matches(l, kw));
  const html = [
    '<div class="page vc">',
    '<header class="vc-bar"><div class="vc-bar-main"><h1>导航</h1><input class="search" placeholder="搜索标题、分类或网址…" value="' + esc(kw) + '"></div>' +
    '<div class="vc-bar-actions"><button class="icon-btn-primary" title="新增" aria-label="新增">' + ICON_ADD + '<span>新增</span></button></div></header>'
  ];

  if (pinned.length) {
    html.push('<section class="vc-section"><h2 class="sec-title">常用<span class="count">' + pinned.length + '</span></h2><div class="vc-strip">');
    for (const l of pinned) {
      html.push('<div class="vc-chip">' +
        '<a class="vc-chip-main" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + iconHtml(l, { iconOnly: true }) + '<span class="vc-chip-title">' + hl(l.title, kw) + '</span></a>' +
        '<button class="tile-action-btn" title="编辑" aria-label="编辑">' + ICON_EDIT + '</button></div>');
    }
    html.push('</div></section>');
  }

  for (const cat of DATA) {
    const links = cat.links.filter((l) => matches(l, kw, cat.name));
    if (!links.length) continue;
    html.push('<section class="vc-band"><div class="vc-band-head"><h2>' + esc(cat.name) + '</h2><span class="count">' + links.length + '</span></div><div class="vc-grid">');
    for (const l of links) {
      html.push('<div class="vc-tile">' + iconHtml(l) +
        '<a class="vc-tile-main" href="' + esc(l.url) + '" target="_blank" rel="noopener"><span class="vc-tile-title">' + hl(l.title, kw) + '</span><br><span class="vc-tile-domain">' + esc(domain(l.url)) + '</span></a>' +
        '<button class="tile-action-btn" title="编辑" aria-label="编辑">' + ICON_EDIT + '</button></div>');
    }
    html.push('</div></section>');
  }
  html.push('</div>');
  if (state.modal.visible) html.push(modalHtml());
  return html.join('');
}

function renderPage() {
  app.innerHTML = render();
  app.querySelectorAll('.search').forEach((el) => {
    el.addEventListener('input', () => {
      state.kw = el.value;
      const caret = el.selectionStart;
      renderPage();
      const next = app.querySelector('.search');
      if (next) { next.focus(); next.setSelectionRange(caret, caret); }
    });
  });
  const addBtn = app.querySelector('.icon-btn-primary');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      state.modal = { visible: true, tab: 'link' };
      renderPage();
    });
  }
  app.querySelectorAll('.modal-tab').forEach((el) => {
    el.addEventListener('click', () => {
      state.modal.tab = el.dataset.tab;
      renderPage();
    });
  });
  const mask = app.querySelector('.modal-mask');
  if (mask) {
    mask.addEventListener('click', (e) => {
      if (e.target === mask) {
        state.modal.visible = false;
        renderPage();
      }
    });
  }
  const cancel = app.querySelector('#modal-cancel');
  if (cancel) {
    cancel.addEventListener('click', () => {
      state.modal.visible = false;
      renderPage();
    });
  }
  app.querySelectorAll('.modal form').forEach((f) => {
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      state.modal.visible = false;
      renderPage();
    });
  });
}

/* favicon 加载失败 → 显示兜底图标 */
app.addEventListener('error', (e) => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.dataset.title !== undefined) {
    img.dataset.hidden = '1';
  }
}, true);

renderPage();
</script>
</body>
</html>
