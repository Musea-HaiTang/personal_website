<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日记页原型 · 便利贴 × 信纸</title>
<!--
  PROTOTYPE - 可丢弃原型，不入生产。
  日记页最终版：贴角信纸（便利贴闪念 + 信纸日记 + 图表 + 编辑/往日记录弹窗）。
-->
<style>
:root{
  --paper:#f7f5f1; --paper-soft:#f4f1ea;
  --card:#fffefc; --hairline:#e9e3d9;
  --ink:#2b2622; --sub:#7c7468;
  --teal:#0e7c74; --teal-dark:#0a6a63; --teal-soft:#e7f1ef;
  --amber:#b7791f; --amber-soft:#faf1dd; --amber-line:#e8d6a8;
  --red:#c4533a; --red-soft:#f9ebe5;
  --serif:"Songti SC","STSong",SimSun,serif;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:var(--ink)}
.serif{font-family:var(--serif)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{width:190px;flex-shrink:0;border-right:1px solid var(--hairline);background:var(--card);padding:22px 14px}
.side h1{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.04em;margin-bottom:20px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side a{display:block;padding:7px 12px;border-radius:8px;font-size:14px;color:var(--sub);text-decoration:none}
.side a.active{background:var(--teal-soft);color:var(--teal);font-weight:600}
.side a:hover{background:var(--paper-soft);color:var(--ink)}
.main{flex:1;padding:26px 30px 120px;min-width:0}
.page{max-width:1120px;margin:0 auto}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{font-family:var(--serif);font-size:26px;font-weight:700;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn-teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:5px 12px;font-size:13px}
.streak b{font-size:15px}
.otd-pop{display:none;position:absolute;right:0;top:42px;width:320px;background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 12px 32px rgba(43,38,34,.14);padding:16px;z-index:20}
.otd-pop.show{display:block}
.otd-wrap{position:relative}
.otd-pop h4{font-family:var(--serif);font-size:15px;margin-bottom:6px}
.otd-pop p{font-size:13px;color:var(--sub)}
.otd-pop .date{font-size:12px;color:var(--amber);margin-bottom:8px;font-weight:600}

/* ---------- papers ---------- */
.paper{background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 1px 3px rgba(43,38,34,.05)}
.letter{position:relative;display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .15s;background:#fdfbf7;font-family:"KaiTi","STKaiti","Kaiti SC","楷体",serif;border-radius:8px;box-shadow:0 1px 3px rgba(43,38,34,.05),inset 0 0 60px rgba(183,121,31,.025)}
.letter.clickable{cursor:pointer}
.letter.clickable:hover{box-shadow:0 6px 18px rgba(43,38,34,.08)}
.letter .head{position:relative;padding:16px 24px 12px}
.letter .head::before{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;background:#e8e2d4}
.letter .head::after{content:"记";position:absolute;top:12px;right:20px;width:26px;height:26px;background:var(--teal);color:#fff;font-family:var(--serif);font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:5px;transform:rotate(-4deg);box-shadow:0 1px 2px rgba(43,38,34,.18);line-height:1}
.letter .head .date{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.04em}
.letter .head .week{font-size:12px;color:var(--sub);margin-top:3px}
.letter .head.page-head{display:flex;align-items:flex-end;gap:10px;padding:16px 24px 10px}
.letter .head.page-head::before{display:none}
.letter .head.page-head .date{font-size:14px;font-weight:400;color:var(--sub);letter-spacing:.03em;margin-right:34px;flex-shrink:0;padding-bottom:2px}
.page-title{flex:1;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:6px;border-bottom:1px dashed var(--hairline)}
.page-tags{display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px 12px}
.letter .body{padding:6px 24px 18px;flex:1;display:flex;flex-direction:column;background:repeating-linear-gradient(to bottom, transparent 0 29px, #ece7da 29px 30px);line-height:30px;font-size:16px}
.letter .empty{color:var(--sub);font-size:15px}
.tag{background:var(--paper-soft);color:var(--sub);border-radius:999px;padding:2px 9px;font-size:12px}
.letter .sum-ex{font-size:16px;color:var(--ink);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.letter textarea{width:100%;min-height:200px;border:none;resize:vertical;font-size:16px;line-height:30px;outline:none;padding:6px 24px 8px;background:repeating-linear-gradient(to bottom, transparent 0 29px, #ece7da 29px 30px)}
.letter .ed-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding:12px 22px;border-top:1px solid var(--hairline)}
.letter .wc{font-size:12px;color:var(--sub);margin-right:auto}

.sticky{background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:5px;box-shadow:2px 4px 10px rgba(43,38,34,.15);transform:rotate(-1.1deg);position:relative}
.sticky::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(1deg);width:70px;height:16px;background:rgba(255,255,255,.45);border:1px solid var(--amber-line);border-bottom:none;border-radius:3px 3px 0 0}
.sticky .s-head{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--amber);padding:14px 16px 4px}
.sticky .notes{display:flex;flex-direction:column;gap:8px;padding:8px 16px 14px}
.sticky .note{background:rgba(255,255,255,.55);border:1px dashed var(--amber-line);border-radius:6px;padding:7px 10px;font-size:13px}
.sticky .note .t{display:block;font-size:11px;color:var(--amber);margin-top:2px}
.sticky .add{display:flex;gap:6px;padding:0 16px 16px}
.sticky .add input{flex:1;border:1px solid var(--amber-line);border-radius:6px;background:#fff;padding:7px 10px;font-size:13px;outline:none}
.sticky .add input:focus{border-color:var(--amber)}

/* ---------- stats & charts ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--hairline);border-radius:12px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--teal);line-height:1.3}
.charts{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:26px}
.chart-card{background:var(--card);border:1px solid var(--hairline);border-radius:12px;padding:16px 18px}
.chart-card.wide{grid-column:span 2}
.chart-card h3{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:12px}
.hm{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.hm i{width:13px;height:13px;border-radius:3px;background:var(--paper-soft);border:1px solid #efe9dd}
.hm i.c1{background:#d8eae7;border-color:#d8eae7}
.hm i.c2{background:#9fcdc6;border-color:#9fcdc6}
.hm i.c3{background:#58a99f;border-color:#58a99f}
.hm i.c4{background:var(--teal);border-color:var(--teal)}
.hm-legend{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--sub)}
.hm-legend i{width:10px;height:10px;border-radius:2px;background:var(--paper-soft);border:1px solid #efe9dd}
.hm-legend i.c1{background:#d8eae7;border-color:#d8eae7}
.hm-legend i.c2{background:#9fcdc6;border-color:#9fcdc6}
.hm-legend i.c3{background:#58a99f;border-color:#58a99f}
.hm-legend i.c4{background:var(--teal);border-color:var(--teal)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row .lbl{font-size:12px;color:var(--sub);margin-bottom:3px;display:flex;justify-content:space-between}
.bar-row .track{display:flex;gap:3px;height:12px}
.bar-row .track i{display:block;height:100%;border-radius:3px}
.bar-row .track i.diary{background:var(--teal)}
.bar-row .track i.flash{background:var(--amber)}
.tags{display:flex;flex-direction:column;gap:8px}
.tag-row{display:flex;align-items:center;gap:8px;font-size:13px}
.tag-row .name{width:48px;flex-shrink:0;color:var(--sub)}
.tag-row .track{flex:1;height:10px;background:var(--paper-soft);border-radius:5px;overflow:hidden}
.tag-row .track i{display:block;height:100%;background:var(--teal);border-radius:5px}
.tag-row .cnt{width:26px;text-align:right;font-size:12px;color:var(--sub)}

/* ---------- timeline (history modal) ---------- */
.search{width:100%;border:1px solid var(--hairline);border-radius:8px;background:var(--card);padding:8px 12px;font-size:13px;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--teal)}
.timeline{display:flex;flex-direction:column;gap:9px}
.tl{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--hairline);border-radius:10px;padding:11px 14px}
.tl.flash{background:var(--amber-soft);border-color:var(--amber-line);transform:rotate(-.25deg)}
.tl .when{width:86px;flex-shrink:0;font-size:12px;color:var(--sub);padding-top:2px}
.tl .body{flex:1;min-width:0}
.tl .body .tt{font-size:14px;font-weight:600}
.tl .body .ex{font-size:13px;color:var(--sub);margin-top:2px}
.tl .kind{font-size:11px;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:1px 8px;flex-shrink:0}
.tl.flash .kind{color:var(--amber);background:rgba(255,255,255,.6)}
.tl .tags-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}

/* ---------- variant B ---------- */
#vB .hero{position:relative;max-width:780px;margin:0 auto}
#vB .letter{min-height:360px}
#vB .hero .letter .body,#vB .hero .letter textarea{padding-right:250px}
#vB .letter .head::after{display:none}
#vB .page-head .date{margin-right:232px}
#vB .corner{position:absolute;top:-12px;right:-14px;width:220px;z-index:5}
#vB .corner .sticky{transform:rotate(3.5deg)}
#vB .mid{max-width:780px;margin:0 auto}

/* ---------- history modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(43,38,34,.38);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:7vh 18px 40px}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--hairline);border-radius:16px;box-shadow:0 20px 60px rgba(43,38,34,.32);width:min(780px,100%);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--hairline)}
.m-head h3{font-family:var(--serif);font-size:18px;font-weight:700;margin-right:auto}
.tabs{display:flex;gap:8px;padding:12px 20px 0}
.tab{border:1px solid var(--hairline);background:var(--card);color:var(--sub);border-radius:999px;padding:5px 14px;font-size:13px}
.tab.active{background:var(--teal);border-color:var(--teal);color:#fff}
.m-body{flex:1;overflow:auto;padding:14px 20px 20px}

/* ---------- edit modal (big letter) ---------- */
.edit-overlay{position:fixed;inset:0;background:rgba(43,38,34,.45);display:none;align-items:center;justify-content:center;z-index:85;padding:24px}
.edit-overlay.show{display:flex}
.edit-modal{width:min(680px,100%);max-height:88vh;box-shadow:0 24px 70px rgba(43,38,34,.4);background:#fdfbf7}
.edit-modal .edit-head{display:flex;align-items:flex-end;gap:10px;padding:14px 24px 10px}
.edit-modal .edit-head::before{display:none}
.edit-modal .edit-head .date{font-size:14px;color:var(--sub);margin-left:auto;flex-shrink:0;letter-spacing:.03em;margin-right:34px}
.edit-scroll{flex:1;overflow:auto;padding:12px 24px 18px}
.title-input{width:100%;border:none;border-bottom:1px dashed var(--hairline);background:transparent;font-family:"KaiTi","STKaiti","Kaiti SC","楷体",serif;font-size:22px;font-weight:700;padding:2px 2px 6px;outline:none}
.edit-modal .edit-head .title-input{flex:1;margin-bottom:0}
.tag-zone{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag-selected{display:flex;gap:6px;flex-wrap:wrap}
.tag-chip{display:inline-flex;align-items:center;gap:3px;background:var(--teal-soft);color:var(--teal);border:1px solid var(--teal);border-radius:999px;padding:2px 9px;font-size:13px}
.tag-chip button{background:none;border:none;color:var(--teal);font-size:12px;padding:0 0 0 2px;cursor:pointer}
.tag-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:300px;background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:0 12px 32px rgba(43,38,34,.16);padding:14px}
.tag-pop.show{display:block}
.tag-pop h5{font-size:12px;color:var(--sub);margin:0 0 8px}
.tag-pop-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag-opt{border:1px solid var(--hairline);background:var(--card);color:var(--sub);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.tag-opt.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}
.tag-pop-add{display:flex;gap:6px}
.tag-pop-add input{flex:1;min-width:0;border:1px solid var(--hairline);border-radius:6px;padding:5px 9px;font-size:13px;outline:none}
.tag-pop-add button{border:1px solid var(--hairline);background:var(--card);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--ink);cursor:pointer}
#editContent{width:100%;min-height:300px;border:none;resize:vertical;font-family:"KaiTi","STKaiti","Kaiti SC","楷体",serif;font-size:16px;line-height:30px;outline:none;padding:6px 0;background:repeating-linear-gradient(to bottom, transparent 0 29px, #ece7da 29px 30px)}

/* ---------- variants switch ---------- */
.variant{display:none}
body[data-v="B"] #vB{display:block}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--teal);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;box-shadow:0 8px 24px rgba(43,38,34,.25);opacity:0;pointer-events:none;transition:.25s;z-index:98}
.toast.show{opacity:1}

@media (max-width:960px){
  .side{display:none}
  #vB .corner{position:static;width:100%;margin:-6px auto 0}
  #vB .hero .letter .body,#vB .hero .letter textarea{padding-right:22px}
  .charts{grid-template-columns:1fr}
  .chart-card.wide{grid-column:span 1}
}
</style>
</head>
<body data-v="B">

<div class="shell">
  <aside class="side">
    <h1>个人网站</h1>
    <nav>
      <a href="#">首页</a>
      <a href="#">计划</a>
      <a href="#" class="active">日记</a>
      <a href="#">番茄钟</a>
      <a href="#">导航</a>
    </nav>
  </aside>

  <main class="main">
    <div class="page">

      <!-- ============ B 贴角信纸 ============ -->
      <section class="variant" id="vB">
        <div class="topbar">
          <h2>日记</h2>
          <div class="otd-wrap">
            <button class="btn otd">📬 去年今天</button>
            <div class="otd-pop">
              <div class="date">2025-08-15 · 星期六</div>
              <h4>《杭州出差那两天》</h4>
              <p>去年的今天你在杭州出差，晚上沿着西湖走了半圈，记了一篇「跑完步去吃了碗片儿川」。想回去看看吗？</p>
            </div>
          </div>
          <button class="btn btn-history">📚 往日记录</button>
          <span class="streak">已连续记录 <b>23</b> 天</span>
        </div>

        <div class="hero">
          <div class="paper letter clickable">
            <div class="head page-head">
              <div class="page-title"></div>
              <div class="date serif">八月十五 · 星期六</div>
            </div>
            <div class="page-tags"></div>
            <div class="body"></div>
          </div>
          <div class="corner">
            <div class="sticky">
              <div class="s-head">灵感</div>
              <div class="notes"></div>
              <div class="add"><input class="note-input" placeholder="想到了就贴"><button class="btn btn-note">贴</button></div>
            </div>
          </div>
        </div>

        <div class="mid">
          <div class="stats"></div>
          <div class="charts">
            <div class="chart-card wide"><h3>写作热力图 · 近 6 个月</h3><div class="heatmap"></div><div class="hm-legend">少 <i class="c0"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i> 多</div></div>
            <div class="chart-card"><h3>每月字数 &amp; 闪念条数</h3><div class="bars"></div></div>
            <div class="chart-card"><h3>常用标签</h3><div class="tags"></div></div>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<div class="overlay" id="historyOverlay">
  <div class="modal">
    <div class="m-head">
      <h3>往日记录</h3>
      <button class="btn close-history">关闭</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-k="all">全部</button>
      <button class="tab" data-k="diary">日记</button>
      <button class="tab" data-k="flash">闪念</button>
    </div>
    <div class="m-body">
      <input class="search" id="histSearch" placeholder="搜索标题 / 标签 / 内容…">
      <div class="timeline" id="histList"></div>
    </div>
  </div>
</div>

<div class="edit-overlay" id="editOverlay">
  <div class="paper letter edit-modal">
    <div class="head edit-head">
      <input id="editTitle" class="title-input" placeholder="标题">
      <div class="date serif">八月十五 · 星期六</div>
    </div>
    <div class="edit-scroll">
      <div class="tag-zone" id="tagZone">
        <div class="tag-selected" id="tagSelected"></div>
        <button type="button" class="btn tag-open" id="tagOpen">＋ 标签</button>
        <div class="tag-pop" id="tagPop">
          <h5>常用标签</h5>
          <div class="tag-pop-list" id="tagPopList"></div>
          <div class="tag-pop-add"><input id="newTag2" placeholder="新标签"><button type="button" id="addTagBtn2">添加</button></div>
        </div>
      </div>
      <textarea id="editContent" placeholder="用 Markdown 写今天的日记…"></textarea>
    </div>
    <div class="ed-actions"><span class="wc" id="editWc"></span><button class="btn cancel-edit">取消</button><button class="btn btn-teal save-edit">保存</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 假数据（固定种子，刷新不变） ================= */
const BASE = new Date('2026-08-15T12:00:00')
function iso(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()) }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x }
function seedRand(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296 } }
const rnd = seedRand(20260815)
function pick(arr){ return arr[Math.floor(rnd()*arr.length)] }

const TITLES=['今天的状态','关于个人网站的一点想法','跑步日记','读完《局外人》','踩了个坑：编码问题','随手记','周末复盘','看了一部电影','一个小灵感','折腾纸感主题','深夜随想','给未来自己的信','搬砖记录','早起的第二天','老友聚会','台风天在家','第一次用闪念','计划页终于顺手了']
const TAGS=['生活','工作','技术','随笔','读书','健康']
const PHRASES=['把 idea 落地成代码','上午开会下午写码','纸感主题又调了一版','跑步的时候想通了一件事','买了一本书还没拆','天气闷热，效率一般','折腾了一晚上依赖问题','把旧日记导进来了','晚上看了会儿书','给朋友回了消息','整理了这周的 todo','学会了用新的 API','散步时拍了张照','临时改了计划','想清楚了一个取舍','今天没有太多事']

const diaries=[]
for(let i=1;i<=170;i++){
  if(rnd()<0.36){
    const d=iso(addDays(BASE,-i))
    const words=60+Math.floor(rnd()*840)
    const nTags=1+Math.floor(rnd()*2)
    const tags=[]; for(let j=0;j<nTags;j++){ const t=pick(TAGS); if(!tags.includes(t)) tags.push(t) }
    diaries.push({d,t:pick(TITLES),tags,w:words,excerpt:pick(PHRASES)+'。'+pick(PHRASES)+'。'})
  }
}
diaries.push({d:'2026-08-15',t:'日记页要重做啦',tags:['随笔','工作'],w:420,excerpt:'方向聊清楚了：便利贴记灵感，信纸写日记，下面放图表。整个页面就两个比喻，干净又统一。'})
diaries.push({d:'2026-08-14',t:'计划页收尾',tags:['工作'],w:310,excerpt:'把复盘顺延和导出功能都跑通了一遍，pytest 25 项全过。'})
diaries.push({d:'2026-08-12',t:'跑步 + 读《局外人》',tags:['健康','读书'],w:560,excerpt:'傍晚跑了 5 公里，回来翻了几页《局外人》。'})
diaries.push({d:'2026-08-10',t:'设计日记页的时候想到的',tags:['随笔'],w:230,excerpt:'灵感应该像便利贴，随手一贴；日记像信纸，摊开来慢慢写。'})
diaries.sort((a,b)=> b.d.localeCompare(a.d))

const FLASH_POOL=['灵感：闪念入口可以做成一张便利贴','要不要把番茄钟也接进日记页','试试把跑步记录加进月度图','想到了一个信纸横线的 CSS 写法','周末想去趟书店','这个页面还缺个去年今天','字体换成楷体试试？','DeepSeek 的 json mode 真稳','明天记得给花浇水']
const flashes=[]
diaries.forEach(e=>{ if(rnd()<0.24){ const n=1+Math.floor(rnd()*2); for(let i=0;i<n;i++){ const hh=8+Math.floor(rnd()*14), mm=Math.floor(rnd()*60); flashes.push({ts:e.d+' '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'),txt:pick(FLASH_POOL)}) } }})
flashes.push({ts:'2026-08-15 20:14',txt:'今天下午跑了 5 公里，配速进了 6 分'})
flashes.push({ts:'2026-08-15 09:02',txt:'闪念和日记的隐喻：便利贴 vs 信纸'})

const TODAY_DIARY=diaries.find(e=>e.d==='2026-08-15')
const TODAY_FLASH=flashes.filter(f=>f.ts.startsWith('2026-08-15'))
let todayTags = TODAY_DIARY ? [...TODAY_DIARY.tags] : []

/* ================= 渲染 ================= */
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate()) }
function weekday(d){ return '日一二三四五六'[d.getDay()] }

function renderStats(el){
  const totalWords=diaries.reduce((s,e)=>s+e.w,0)
  const thisYear=diaries.filter(e=>e.d.startsWith('2026')).length
  const items=[['总篇数',diaries.length],['总字数',totalWords.toLocaleString()],['今年篇数',thisYear],['连续记录','23 天']]
  el.innerHTML=items.map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')
}

function renderHeatmap(el){
  const counts={}
  diaries.forEach(e=>counts[e.d]=(counts[e.d]||0)+1)
  flashes.forEach(f=>{ const d=f.ts.slice(0,10); counts[d]=(counts[d]||0)+1 })
  const start=addDays(BASE,-(25*7))
  let cells=''
  for(let w=0;w<26;w++){
    for(let dw=0;dw<7;dw++){
      const d=addDays(start,w*7+dw)
      const key=iso(d)
      const c=counts[key]||0
      const cls=c===0?'c0':c===1?'c1':c===2?'c2':c===3?'c3':'c4'
      cells+=`<i class="${cls}" title="${key}：${c} 条记录"></i>`
    }
  }
  el.innerHTML=cells
}

function renderBars(el){
  const months=[]
  for(let i=5;i>=0;i--){
    const d=new Date(BASE.getFullYear(),BASE.getMonth()-i,1)
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
    const next=new Date(d.getFullYear(),d.getMonth()+1,1)
    const words=diaries.filter(e=>e.d>=key+'-01'&&e.d<iso(next)).reduce((s,e)=>s+e.w,0)
    const fc=flashes.filter(f=>f.ts.startsWith(key)).length
    months.push({label:(d.getMonth()+1)+'月',words,fc,max:0})
  }
  const max=Math.max(...months.map(m=>m.words),1)
  el.innerHTML=months.map(m=>`
    <div class="bar-row">
      <div class="lbl"><span>${m.label}</span><span>${m.words.toLocaleString()} 字 · ${m.fc} 条闪念</span></div>
      <div class="track"><i class="diary" style="width:${Math.round(m.words/max*100)}%"></i><i class="flash" style="width:${Math.min(100,Math.round(m.fc/20*100))}%"></i></div>
    </div>`).join('')
}

function renderTags(el){
  const tally={}
  diaries.forEach(e=>e.tags.forEach(t=>tally[t]=(tally[t]||0)+1))
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,6)
  const max=top[0][1]
  el.innerHTML=top.map(([t,c])=>`
    <div class="tag-row"><span class="name">${t}</span><div class="track"><i style="width:${Math.round(c/max*100)}%"></i></div><span class="cnt">${c}</span></div>`).join('')
}

const HIST_ITEMS=[]
diaries.forEach(e=>HIST_ITEMS.push({kind:'diary',date:e.d,label:fmtDate(new Date(e.d+'T00:00')),t:e.t,tags:e.tags,ex:e.excerpt}))
flashes.forEach(f=>HIST_ITEMS.push({kind:'flash',date:f.ts,label:f.ts.slice(5,10).replace('-','/')+' '+f.ts.slice(11,16),t:f.txt}))
HIST_ITEMS.sort((a,b)=> b.date.localeCompare(a.date))

let histKind='all', histQuery=''
function histHTML(list){
  return list.map(it=>{
    if(it.kind==='flash') return `<div class="tl flash"><span class="when">${it.label}</span><div class="body"><div class="tt">${it.t}</div></div><span class="kind">闪念</span></div>`
    const tags=it.tags.map(t=>`<span class="tag">${t}</span>`).join('')
    return `<div class="tl"><span class="when">${it.label}</span><div class="body"><div class="tt">${it.t}</div><div class="ex">${it.ex}</div>${tags?'<div class="tags-row">'+tags+'</div>':''}</div><span class="kind">日记</span></div>`
  }).join('')
}
function renderHistory(){
  const list=HIST_ITEMS.filter(it=>(histKind==='all'||it.kind===histKind)&&(!histQuery||(it.t+' '+(it.ex||'')+' '+(it.tags?it.tags.join(' '):'')).toLowerCase().includes(histQuery)))
  document.getElementById('histList').innerHTML=histHTML(list)
}

let todayTitle = TODAY_DIARY ? TODAY_DIARY.t : ''
let todayExcerpt = TODAY_DIARY ? TODAY_DIARY.excerpt : ''
const ALL_TAGS = [...new Set(diaries.flatMap(e=>e.tags))].sort()

function letterSummary(sec){
  const head=sec.querySelector('.letter .head')
  const tagsEl=sec.querySelector('.page-tags')
  const body=sec.querySelector('.letter .body')
  const pt=head.querySelector('.page-title')
  if(pt) pt.textContent=todayTitle
  if(todayTitle){
    if(tagsEl) tagsEl.innerHTML=todayTags.map(t=>`<span class="tag-chip">${t}</span>`).join('')
    body.innerHTML=`<div class="sum-ex">${todayExcerpt}</div>`
  }else{
    if(tagsEl) tagsEl.innerHTML=''
    body.innerHTML='<p class="empty">今天还没有写 · 点这里摊开信纸</p>'
  }
}

function renderSticky(sec){
  const box=sec.querySelector('.notes')
  box.innerHTML=TODAY_FLASH.map(f=>`<div class="note">${f.txt}<span class="t">${f.ts.slice(11,16)}</span></div>`).join('')
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),1800)
}

/* ================= 交互 ================= */
function bindVariant(sec){
  renderStats(sec.querySelector('.stats'))
  renderHeatmap(sec.querySelector('.heatmap'))
  renderBars(sec.querySelector('.bars'))
  renderTags(sec.querySelector('.tags'))
  renderSticky(sec)
  const letter=sec.querySelector('.letter')
  letterSummary(sec)
  letter.addEventListener('click',openEdit)

  const noteInput=sec.querySelector('.note-input')
  const addNote=()=>{
    const v=noteInput.value.trim(); if(!v) return
    const now=new Date(); const hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')
    sec.querySelector('.notes').insertAdjacentHTML('beforeend',`<div class="note">${v.replace(/</g,'&lt;')}<span class="t">${hm}</span></div>`)
    noteInput.value=''; toast('贴了一张灵感')
  }
  noteInput.addEventListener('keydown',e=>{ if(e.key==='Enter') addNote() })
  const btn=sec.querySelector('.btn-note'); if(btn) btn.addEventListener('click',addNote)
}

document.querySelectorAll('.variant').forEach(bindVariant)

document.querySelectorAll('.otd').forEach(btn=>{
  btn.addEventListener('click',e=>{ e.stopPropagation(); const pop=btn.nextElementSibling; document.querySelectorAll('.otd-pop').forEach(p=>{ if(p!==pop)p.classList.remove('show') }); pop.classList.toggle('show') })
})
document.addEventListener('click',e=>{ if(!e.target.closest('.otd-wrap')) document.querySelectorAll('.otd-pop').forEach(p=>p.classList.remove('show')) })

/* ================= 往日记录弹窗 ================= */
const overlay=document.getElementById('historyOverlay')
document.querySelectorAll('.btn-history').forEach(b=>b.addEventListener('click',()=>{ overlay.classList.add('show'); renderHistory() }))
document.querySelector('.close-history').addEventListener('click',()=>overlay.classList.remove('show'))
overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.classList.remove('show') })
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'))
  t.classList.add('active'); histKind=t.dataset.k; renderHistory()
}))
document.getElementById('histSearch').addEventListener('input',e=>{ histQuery=e.target.value.trim().toLowerCase(); renderHistory() })

/* ================= 日记编辑弹窗（大信纸） ================= */
const editOverlay=document.getElementById('editOverlay')
const editTitle=document.getElementById('editTitle')
const editContent=document.getElementById('editContent')
const editWc=document.getElementById('editWc')
const tagZone=document.getElementById('tagZone')
const tagOpen=document.getElementById('tagOpen')
const tagPop=document.getElementById('tagPop')
const tagSelected=document.getElementById('tagSelected')
const tagPopList=document.getElementById('tagPopList')

function renderTagPick(){
  tagSelected.innerHTML=todayTags.map(t=>`<span class="tag-chip">${t}<button type="button" data-rm="${t}">×</button></span>`).join('')
  tagPopList.innerHTML=ALL_TAGS.map(t=>`<button type="button" class="tag-opt${todayTags.includes(t)?' on':''}" data-t="${t}">${t}</button>`).join('')
}
function openEdit(){
  editTitle.value=todayTitle
  editContent.value=todayTitle ? todayTitle+'\n\n'+todayExcerpt : ''
  tagPop.classList.remove('show')
  renderTagPick()
  editWc.textContent='已写 '+editContent.value.replace(/\s/g,'').length.toLocaleString()+' 字'
  editOverlay.classList.add('show')
  editTitle.focus()
}
function closeEdit(){ editOverlay.classList.remove('show') }
function addNewTag(){
  const inp=document.getElementById('newTag2'); const v=inp.value.trim(); if(!v) return
  if(!ALL_TAGS.includes(v)) ALL_TAGS.push(v)
  if(!todayTags.includes(v)) todayTags.push(v)
  inp.value=''; renderTagPick()
}
editContent.addEventListener('input',()=>editWc.textContent='已写 '+editContent.value.replace(/\s/g,'').length.toLocaleString()+' 字')
tagOpen.addEventListener('click',e=>{ e.stopPropagation(); tagPop.classList.toggle('show') })
document.addEventListener('click',e=>{ if(!e.target.closest('#tagPop')) tagPop.classList.remove('show') })
tagSelected.addEventListener('click',e=>{
  const b=e.target.closest('[data-rm]'); if(!b) return
  todayTags=todayTags.filter(t=>t!==b.dataset.rm); renderTagPick()
})
tagPopList.addEventListener('click',e=>{
  const b=e.target.closest('.tag-opt'); if(!b) return
  const t=b.dataset.t
  todayTags=todayTags.includes(t)?todayTags.filter(x=>x!==t):[...todayTags,t]
  renderTagPick()
})
document.getElementById('addTagBtn2').addEventListener('click',addNewTag)
document.getElementById('newTag2').addEventListener('keydown',e=>{ if(e.key==='Enter') addNewTag() })
document.querySelector('.save-edit').addEventListener('click',()=>{
  todayTitle=editTitle.value.trim()||'无标题'
  todayExcerpt=editContent.value.replace(/\s+/g,' ').trim()||'（正文为空）'
  closeEdit()
  document.querySelectorAll('.variant').forEach(letterSummary)
  toast('已保存（原型，不落盘）')
})
document.querySelector('.cancel-edit').addEventListener('click',closeEdit)
editOverlay.addEventListener('click',e=>{ if(e.target===editOverlay) closeEdit() })

</script>
