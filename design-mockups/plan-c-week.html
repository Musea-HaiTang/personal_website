<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 C · 周历排期（七列铺开）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f8fb;--card:#fff;--line:#e3e8f0;--ink:#1d2530;--sub:#667085;
  --indigo:#4b5fe8;--indigo-soft:#eef0fe;--green:#17a673;--green-soft:#e8f7f1;
  --amber:#c4760a;--amber-soft:#fdf3e0;--red:#d64545;--red-soft:#fdecec;
}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.app{max-width:1320px;margin:0 auto;padding:24px 26px 56px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.topbar p{color:var(--sub);font-size:13px;margin-top:4px}
.actions{display:flex;align-items:center;gap:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--indigo);color:#fff;font-weight:600}
.btn{border:0;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--indigo);color:#fff}
.goals-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.goals-strip .label{font-size:12px;font-weight:700;color:var(--sub);margin-right:4px}
.goal-chip{border:1px solid var(--line);background:#fafbfe;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:600}
.goal-chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.goal-chip .cnt{font-size:11px;color:var(--sub);background:#eef1f6;border-radius:99px;padding:1px 7px}
.chip-add{border:1px dashed #c9d3e4;background:none;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
.chip-add:hover{color:var(--indigo);border-color:var(--indigo)}
.goal-detail{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.goal-detail.show{display:block}
.goal-detail .row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-top:1px dashed var(--line)}
.goal-detail .row:first-child{border-top:0}
.goal-detail .row .day{margin-left:auto;font-size:11px;color:var(--sub);background:#f2f4f8;border-radius:6px;padding:2px 7px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;min-width:0}
.day-col{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:300px;display:flex;flex-direction:column;overflow:hidden}
.day-col.today{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.day-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.day-col.today .day-head{background:var(--indigo-soft)}
.day-head b{font-size:14px}
.day-head .date{font-size:12px;color:var(--sub)}
.day-head .pill{font-size:10px;font-weight:800;background:var(--indigo);color:#fff;border-radius:99px;padding:2px 7px;letter-spacing:.05em}
.day-tasks{padding:8px;flex:1}
.t{display:flex;align-items:center;gap:7px;padding:8px 6px;border-bottom:1px dashed var(--line);font-size:13px}
.t:last-child{border-bottom:0}
.t.done .name{color:#9aa3b2;text-decoration:line-through}
.t .dot{width:7px;height:7px;border-radius:50%;flex:none}
.t .name{flex:1;min-width:0}
.t .imp{font-size:10px;font-weight:700;border-radius:5px;padding:2px 5px;flex:none}
.imp.high{color:var(--red);background:var(--red-soft)}
.imp.mid{color:var(--amber);background:var(--amber-soft)}
.imp.low{color:var(--sub);background:#f0f2f6}
.check{width:16px;height:16px;border:2px solid #c6cdd9;border-radius:50%;flex:none;cursor:pointer;display:grid;place-items:center;user-select:none}
.check.on{background:var(--green);border-color:var(--green)}
.check.on::after{content:"✓";color:#fff;font-size:10px;font-weight:800}
.day-add{border:0;background:none;color:#b7c0cf;font-size:16px;cursor:pointer;padding:8px;margin-top:auto}
.day-add:hover{color:var(--indigo)}
.inline-add{display:flex;gap:6px;padding:8px 6px}
.inline-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;outline:none}
.inline-add input:focus{border-color:var(--indigo)}
.pool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding:13px 16px;background:var(--card);border:1px dashed #c9d3e4;border-radius:12px}
.pool .pool-title{font-size:12px;font-weight:700;color:var(--sub);margin-right:4px}
.pool .chip{display:inline-flex;align-items:center;gap:7px;background:#fafbfe;border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px}
.pool .chip .go{border:0;background:var(--indigo);color:#fff;font-size:11px;font-weight:600;border-radius:99px;padding:3px 8px;cursor:pointer}
.pool .chip .go:hover{filter:brightness(1.08)}
@media(max-width:1100px){.week{grid-template-columns:repeat(7,168px);overflow-x:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>本周排期</h1>
      <p>8月10日 – 8月16日 · 把子任务排到想做的日子，中途有新方向随时加</p>
    </div>
    <div class="actions">
      <div class="seg"><button class="on">周历</button><button onclick="location.href='plan-a-split.html'">今日</button></div>
      <button class="btn">⤓ 导出本周</button>
    </div>
  </header>

  <div class="goals-strip">
    <span class="label">本周方向</span>
    <button class="goal-chip" style="--c:#4b5fe8" onclick="toggleDetail(this)"><i></i>个人网站 P0<span class="cnt">3/5</span></button>
    <button class="goal-chip" style="--c:#17a673" onclick="toggleDetail(this)"><i></i>健身 3 次<span class="cnt">1/3</span></button>
    <button class="goal-chip" style="--c:#d97706" onclick="toggleDetail(this)"><i></i>读完《小王子》<span class="cnt">1/2</span></button>
    <button class="chip-add" onclick="addGoalPrompt()">＋ 新目标</button>
  </div>

  <div class="goal-detail" id="goalDetail"></div>

  <main class="week">
    <div class="day-col">
      <div class="day-head"><b>周一</b><span class="date">8/10</span></div>
      <div class="day-tasks">
        <div class="t"><span class="check on" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name">计划页改版</span><span class="imp high">高</span></div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
    <div class="day-col">
      <div class="day-head"><b>周二</b><span class="date">8/11</span></div>
      <div class="day-tasks">
        <div class="t"><span class="check on" onclick="toggleT(this)"></span><span class="dot" style="background:#17a673"></span><span class="name">跑步 5 公里</span><span class="imp mid">中</span></div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
    <div class="day-col">
      <div class="day-head"><b>周三</b><span class="date">8/12</span></div>
      <div class="day-tasks">
        <div class="t"><span class="check on" onclick="toggleT(this)"></span><span class="dot" style="background:#d97706"></span><span class="name">读完前半</span><span class="imp low">低</span></div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
    <div class="day-col">
      <div class="day-head"><b>周四</b><span class="date">8/13</span></div>
      <div class="day-tasks">
        <div class="t"><span class="check on" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name">计划页改版收尾</span><span class="imp high">高</span></div>
        <div class="t"><span class="check on" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name">后端周接口</span><span class="imp high">高</span></div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
    <div class="day-col">
      <div class="day-head"><b>周五</b><span class="date">8/14</span></div>
      <div class="day-tasks">
        <div class="t"><span class="check on" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name">周导出接口</span><span class="imp high">高</span></div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
    <div class="day-col today">
      <div class="day-head"><span class="pill">今天</span><b>周六</b><span class="date">8/15</span></div>
      <div class="day-tasks">
        <div class="t"><span class="check" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name">前端联调</span><span class="imp high">高</span></div>
        <div class="t"><span class="check" onclick="toggleT(this)"></span><span class="dot" style="background:#17a673"></span><span class="name">力量训练</span><span class="imp mid">中</span></div>
        <div class="t"><span class="check" onclick="toggleT(this)"></span><span class="dot" style="background:#d97706"></span><span class="name">整理书摘</span><span class="imp low">低</span></div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
    <div class="day-col">
      <div class="day-head"><b>周日</b><span class="date">8/16</span></div>
      <div class="day-tasks">
        <div class="t" style="color:#b7c0cf;font-size:12px">休息 · 周复盘</div>
      </div>
      <button class="day-add" onclick="addToDay(this)">＋</button>
    </div>
  </main>

  <footer class="pool" id="pool">
    <span class="pool-title">未排期池</span>
    <span class="chip"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:#4b5fe8;display:inline-block"></span>写验收用例<button class="go" onclick="assignToday(this)">排到今天 →</button></span>
    <span class="chip"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:#17a673;display:inline-block"></span>游泳<button class="go" onclick="assignToday(this)">排到今天 →</button></span>
    <span class="chip"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:#d97706;display:inline-block"></span>写读书笔记<button class="go" onclick="assignToday(this)">排到今天 →</button></span>
  </footer>
</div>

<script>
const details={
  '个人网站 P0':['计划页改版 · 周四','后端周接口 · 周五','前端联调 · 今天','写验收用例 · 未排期','冒烟回归 · 未排期'],
  '健身 3 次':['跑步 5 公里 · 周二','力量训练 · 今天','游泳 · 未排期'],
  '读完《小王子》':['读完前半 · 周三','整理书摘 · 今天','写读书笔记 · 未排期']
};
function toggleDetail(btn){
  const d=document.getElementById('goalDetail');
  const name=btn.childNodes[2].nodeValue.trim();
  if(d.dataset.name===name){d.classList.remove('show');delete d.dataset.name;return;}
  d.dataset.name=name;
  d.innerHTML='<b style="font-size:13px">'+name+'</b>'+(details[name]||[]).map(x=>'<div class="row"><span>'+x+'</span></div>').join('');
  d.classList.add('show');
}
function toggleT(el){el.closest('.t').classList.toggle('done');el.classList.toggle('on')}
function addToDay(btn){
  const col=btn.closest('.day-col');
  const tasks=col.querySelector('.day-tasks');
  const wrap=document.createElement('div');wrap.className='inline-add';
  wrap.innerHTML='<input type="text" placeholder="写件事，回车确认"><button style="border:0;background:#4b5fe8;color:#fff;border-radius:7px;padding:0 9px;cursor:pointer">✓</button>';
  const input=wrap.querySelector('input');
  const ok=()=>{
    const t=input.value.trim();if(!t)return;
    const row=document.createElement('div');row.className='t';
    row.innerHTML='<span class="check" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name"></span><span class="imp mid">中</span>';
    row.querySelector('.name').textContent=t;
    tasks.insertBefore(row,tasks.lastChild&&tasks.lastChild.tagName==='DIV'?tasks.lastChild.nextSibling:null);
    wrap.remove();
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
  wrap.querySelector('button').addEventListener('click',ok);
  tasks.appendChild(wrap);input.focus();
}
function assignToday(btn){
  const chip=btn.closest('.chip');
  const name=chip.childNodes[0].nodeValue.trim();
  const today=document.querySelector('.day-col.today .day-tasks');
  const row=document.createElement('div');row.className='t';
  row.innerHTML='<span class="check" onclick="toggleT(this)"></span><span class="dot" style="background:#4b5fe8"></span><span class="name"></span><span class="imp mid">中</span>';
  row.querySelector('.name').textContent=name;
  today.appendChild(row);
  chip.remove();
}
function addGoalPrompt(){
  const name=prompt('新方向名称：');
  if(!name||!name.trim())return;
  const btn=document.createElement('button');btn.className='goal-chip';btn.style.setProperty('--c','#d64545');
  btn.innerHTML='<i></i><span></span><span class="cnt">0/1</span>';
  btn.querySelector('span').textContent=name.trim();
  btn.onclick=()=>toggleDetail(btn);
  document.querySelector('.goals-strip .chip-add').before(btn);
}
</script>
</body>
</html>
